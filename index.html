                                                                className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${active ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                            >
                                                                {dayName}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {newTaskFreqType === 'one-off' && (
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Due By Date</label>
                                            <input 
                                                type="date" 
                                                value={newTaskDueDate}
                                                onChange={e => setNewTaskDueDate(e.target.value)}
                                                style={{ colorScheme: 'dark' }}
                                                className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                                required
                                            />
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Initial Notes / Comments (Optional)</label>
                                        <textarea 
                                            rows="2"
                                            placeholder="Optional notes..."
                                            value={newTaskComments}
                                            onChange={e => setNewTaskComments(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700"
                                        ></textarea>
                                    </div>

                                    <div className="flex justify-end gap-3 mt-6">
                                        <button type="button" onClick={() => setIsTaskModalOpen(false)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800">Cancel</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 shadow-sm">Save Task</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Report Generator Modal */}
                    {isReportModalOpen && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-2xl w-full p-6 border border-slate-800 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <div>
                                        <h3 className="text-xl font-bold text-white">📊 Performance & Analytical Report</h3>
                                        <p className="text-xs text-slate-400">
                                            Active Filter: <strong className="text-slate-200">{isMasterReport ? 'All Tasks (Master Override)' : viewLabels[view]}</strong> • Date: <strong className="text-slate-200">{currentDate}</strong>
                                        </p>
                                    </div>
                                    <button onClick={() => setIsReportModalOpen(false)} className="text-slate-400 hover:text-slate-200 text-lg font-bold">✕</button>
                                </div>
                                <div className="space-y-4 mb-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Timeframe</label>
                                            <select value={reportTimeframe} onChange={e => setReportTimeframe(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700">
                                                <option value="weekly">Weekly Summary</option>
                                                <option value="monthly">Monthly Summary</option>
                                                <option value="quarterly">Quarterly Review</option>
                                                <option value="yearly">Yearly Overview</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Category Scope</label>
                                            <select 
                                                disabled={isMasterReport}
                                                value={reportCategoryScope} 
                                                onChange={e => setReportCategoryScope(e.target.value)} 
                                                className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700 disabled:opacity-50"
                                            >
                                                <option value="all">All Categories</option>
                                                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex flex-col justify-end">
                                            <label className="flex items-center gap-2 cursor-pointer bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                                                <input 
                                                    type="checkbox"
                                                    checked={isMasterReport}
                                                    onChange={e => setIsMasterReport(e.target.checked)}
                                                    className="w-4 h-4 text-blue-500 bg-slate-900 rounded border-slate-600"
                                                />
                                                <span className="text-xs font-bold text-slate-200">Master Print All</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div className="bg-slate-800/70 rounded-xl p-4 border border-slate-700/80 space-y-3">
                                        <div className="flex justify-between items-center">
                                            <h4 className="font-bold text-slate-100 text-sm">Executive Overview ({reportTimeframe.toUpperCase()})</h4>
                                            {isMasterReport && <span className="text-[10px] bg-blue-950 text-blue-300 border border-blue-800 font-bold px-2 py-0.5 rounded-full">Master Report Mode</span>}
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 text-center">
                                            <div className="bg-slate-900 p-2 rounded-lg border border-slate-800">
                                                <span className="text-[10px] text-slate-400 uppercase font-semibold">Total</span>
                                                <div className="text-lg font-bold text-slate-100">{reportData.total}</div>
                                            </div>
                                            <div className="bg-slate-900 p-2 rounded-lg border border-slate-800">
                                                <span className="text-[10px] text-slate-400 uppercase font-semibold">Completed</span>
                                                <div className="text-lg font-bold text-emerald-400">{reportData.completed}</div>
                                            </div>
                                            <div className="bg-slate-900 p-2 rounded-lg border border-slate-800">
                                                <span className="text-[10px] text-slate-400 uppercase font-semibold">Rate %</span>
                                                <div className="text-lg font-bold text-blue-400">{reportData.overallRate}%</div>
                                            </div>
                                        </div>
                                        <div className="text-xs font-medium text-slate-200 bg-slate-900 p-3 rounded-lg border border-slate-800">
                                            <strong className="text-white">Analytical Feedback:</strong> {reportData.feedback}
                                        </div>
                                    </div>

                                    <div>
                                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Category Breakdown</h4>
                                        <div className="space-y-2">
                                            {reportData.catBreakdown.map((cb, idx) => (
                                                <div key={idx} className="bg-slate-800/60 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-sm">
                                                    <span className="font-medium text-slate-200">{cb.name}</span>
                                                    <span className="text-xs font-semibold px-2 py-1 bg-slate-900 rounded-md text-slate-300 border border-slate-700">{cb.done} / {cb.total} ({cb.rate}%)</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Completed vs Incomplete Task Lists */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="bg-emerald-950/30 border border-emerald-800/70 rounded-xl p-3.5">
                                            <h4 className="text-xs font-bold uppercase tracking-wider text-emerald-300 mb-2 flex justify-between items-center">
                                                <span>✅ Completed Tasks</span>
                                                <span className="bg-emerald-900 text-emerald-200 px-2 py-0.5 rounded-full text-[10px]">{reportData.completedList.length}</span>
                                            </h4>
                                            {reportData.completedList.length === 0 ? (
                                                <p className="text-xs text-slate-500 italic">No completed tasks in this view.</p>
                                            ) : (
                                                <ul className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                                                    {reportData.completedList.map(item => (
                                                        <li key={item.id} className="bg-slate-900 p-2 rounded-lg border border-emerald-900/60 text-xs">
                                                            <div className="font-semibold text-slate-100">{item.name}</div>
                                                            <div className="text-[10px] text-slate-400">{item.categoryName} • {item.freqLabel}</div>
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                        </div>

                                        <div className="bg-rose-950/30 border border-rose-800/70 rounded-xl p-3.5">
                                            <h4 className="text-xs font-bold uppercase tracking-wider text-rose-300 mb-2 flex justify-between items-center">
                                                <span>⏳ Incomplete Tasks</span>
                                                <span className="bg-rose-900 text-rose-200 px-2 py-0.5 rounded-full text-[10px]">{reportData.incompleteList.length}</span>
                                            </h4>
                                            {reportData.incompleteList.length === 0 ? (
                                                <p className="text-xs text-slate-500 italic">All tasks completed!</p>
                                            ) : (
                                                <ul className="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                                                    {reportData.incompleteList.map(item => (
                                                        <li key={item.id} className={`p-2 rounded-lg border text-xs ${item.overdue ? 'bg-red-950/60 border-red-700' : 'bg-slate-900 border-rose-900/60'}`}>
                                                            <div className="flex items-center justify-between gap-1">
                                                                <span className="font-semibold text-slate-100">{item.name}</span>
                                                                {item.overdue && <span className="text-[9px] font-bold bg-red-600 text-white px-1.5 py-0.5 rounded uppercase">Overdue</span>}
                                                            </div>
                                                            <div className="text-[10px] text-slate-400">{item.categoryName} • {item.freqLabel}</div>
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">User Reflections & Notes</label>
                                        <textarea 
                                            rows="3" 
                                            placeholder="Add personal reflections or focus items..." 
                                            value={userReportNotes}
                                            onChange={e => setUserReportNotes(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700"
                                        ></textarea>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setIsReportModalOpen(false)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800">Close</button>
                                    <button onClick={() => window.print()} className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 shadow-sm">Print / Save as PDF</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Cloud Sync & Backup Modal */}
                    {isSyncModalOpen && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-800 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-lg font-bold text-white mb-2">⚡ Firebase Cloud Sync & Backup</h3>
                                <p className="text-xs text-slate-400 mb-4">Paste your Firebase configuration object below (both standard JS object format and JSON are supported).</p>
                                
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Firebase Config Object</label>
                                        <textarea 
                                            rows="5"
                                            placeholder={`{ apiKey: "...", authDomain: "...", projectId: "...", ... }`}
                                            value={firebaseConfigInput}
                                            onChange={e => {
                                                setFirebaseConfigInput(e.target.value);
                                                localStorage.setItem('goal_tracker_fb_config', e.target.value);
                                            }}
                                            className="w-full px-3 py-2 border rounded-xl text-xs font-mono bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700"
                                        ></textarea>
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                                        <div>
                                            <div className="text-sm font-bold text-slate-100">Enable Live Cloud Sync</div>
                                            <div className="text-xs text-slate-400">Syncs automatically in real time across devices</div>
                                        </div>
                                        <input 
                                            type="checkbox"
                                            checked={isCloudSyncActive}
                                            onChange={e => {
                                                setIsCloudSyncActive(e.target.checked);
                                                localStorage.setItem('goal_tracker_cloud_active', e.target.checked ? 'true' : 'false');
                                            }}
                                            className="w-5 h-5 text-blue-500 bg-slate-900 rounded border-slate-600 focus:ring-blue-500 cursor-pointer"
                                        />
                                    </div>

                                    <div className="border-t border-slate-800 pt-4 space-y-2">
                                        <div className="text-xs font-bold text-slate-300 uppercase tracking-wider">Manual JSON Backup</div>
                                        <div className="flex gap-2">
                                            <button onClick={exportBackup} className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium rounded-xl text-xs transition">
                                                📥 Export JSON
                                            </button>
                                            <label className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium rounded-xl text-xs transition text-center cursor-pointer">
                                                📤 Import JSON
                                                <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-end">
                                    <button onClick={() => setIsSyncModalOpen(false)} className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-500">Save & Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
