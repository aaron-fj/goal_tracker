<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Category Goal & Task Tracker with Master Reports</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase App & Firestore Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const initialCategories = [
            {
                id: 'family',
                name: '1. Family / Home',
                color: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                subcomponents: [
                    { id: 'maint', name: 'Maintenance', tasks: [] },
                    { 
                        id: 'fam_time', 
                        name: 'Family Time', 
                        tasks: [
                            { id: 't1', name: 'Teach kids something new', freqType: 'weekly', completed: {} },
                            { id: 't2', name: 'Date night', freqType: 'monthly', completed: {} }
                        ] 
                    },
                    { id: 'admin', name: 'Admin', tasks: [] }
                ]
            },
            {
                id: 'church',
                name: '2. Church Calling',
                color: 'bg-indigo-50 text-indigo-700 border-indigo-200',
                subcomponents: [
                    { 
                        id: 'ministering', 
                        name: 'Ministering', 
                        tasks: [
                            { id: 'c1', name: 'Minister to assigned families', freqType: 'monthly', completed: {} },
                            { id: 'c2', name: 'Empower ministering district', freqType: 'monthly', completed: {} }
                        ] 
                    },
                    { 
                        id: 'councils', 
                        name: 'Councils / Admin', 
                        tasks: [
                            { id: 'c6', name: 'Confirm with teacher', freqType: 'weekly', completed: {} },
                            { id: 'c7', name: 'Print Bulletin', freqType: 'weekly', completed: {} }
                        ] 
                    }
                ]
            },
            {
                id: 'consulting',
                name: '3. Consulting',
                color: 'bg-amber-50 text-amber-700 border-amber-200',
                subcomponents: [
                    { 
                        id: 'research', 
                        name: 'Research / Analysis', 
                        tasks: [
                            { id: 'con2', name: '10 hours / week logged', freqType: 'weekly', completed: {} }
                        ] 
                    }
                ]
            },
            {
                id: 'self_imp',
                name: '4. Self-Improvement',
                color: 'bg-sky-50 text-sky-700 border-sky-200',
                subcomponents: [
                    { 
                        id: 'physical', 
                        name: 'Physical', 
                        tasks: [
                            { id: 's2', name: 'Mobility / core training (15 min)', freqType: 'daily', completed: {} },
                            { id: 's3', name: '10 miles running', freqType: 'weekly', completed: {} }
                        ] 
                    }
                ]
            }
        ];

        function App() {
            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('goal_tracker_data_v8');
                return saved ? JSON.parse(saved) : initialCategories;
            });
            const [view, setView] = useState('daily');
            const [currentDate, setCurrentDate] = useState(new Date().toISOString().split('T')[0]);
            
            // Modal states
            const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
            const [isReportModalOpen, setIsReportModalOpen] = useState(false);
            const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);

            // Add Task granular state
            const [selectedCategory, setSelectedCategory] = useState(initialCategories[0].id);
            const [selectedSubcomp, setSelectedSubcomp] = useState(initialCategories[0].subcomponents[0].id);
            const [newTaskName, setNewTaskName] = useState('');
            const [newTaskFreqType, setNewTaskFreqType] = useState('daily');
            const [newTaskDays, setNewTaskDays] = useState([1, 3, 5]); // Mon, Wed, Fri default
            const [newTaskNthWeek, setNewTaskNthWeek] = useState(2); // e.g. 2nd
            const [newTaskNthDay, setNewTaskNthDay] = useState(2); // e.g. Tuesday
            const [newTaskDueDate, setNewTaskDueDate] = useState(new Date().toISOString().split('T')[0]);

            // Report fields
            const [reportTimeframe, setReportTimeframe] = useState('weekly');
            const [reportCategoryScope, setReportCategoryScope] = useState('all');
            const [isMasterReport, setIsMasterReport] = useState(false);
            const [userReportNotes, setUserReportNotes] = useState('');

            // Firebase Cloud Sync Configuration State
            const [firebaseConfigInput, setFirebaseConfigInput] = useState(() => {
                return localStorage.getItem('goal_tracker_fb_config') || '';
            });
            const [isCloudSyncActive, setIsCloudSyncActive] = useState(() => {
                return localStorage.getItem('goal_tracker_cloud_active') === 'true';
            });
            const [syncStatus, setSyncStatus] = useState('Disconnected');

            const dbRef = useRef(null);
            const unsubscribeRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('goal_tracker_data_v8', JSON.stringify(categories));
            }, [categories]);

            useEffect(() => {
                if (!isCloudSyncActive || !firebaseConfigInput.trim()) {
                    setSyncStatus('Local Mode');
                    if (unsubscribeRef.current) {
                        unsubscribeRef.current();
                        unsubscribeRef.current = null;
                    }
                    return;
                }

                try {
                    let cleanInput = firebaseConfigInput.trim();
                    if (cleanInput.startsWith('{')) {
                        cleanInput = `return (${cleanInput});`;
                    }
                    const config = new Function(cleanInput)();

                    if (!firebase.apps.length) {
                        firebase.initializeApp(config);
                    } else {
                        firebase.app();
                    }

                    dbRef.current = firebase.firestore();
                    setSyncStatus('Connecting...');

                    const docRef = dbRef.current.collection('goal_trackers').doc('main_user_data');

                    unsubscribeRef.current = docRef.onSnapshot((doc) => {
                        if (doc.exists) {
                            const cloudData = doc.data();
                            if (cloudData && cloudData.categories) {
                                setCategories(cloudData.categories);
                                setSyncStatus('🟢 Live Synced');
                            }
                        } else {
                            docRef.set({ categories });
                            setSyncStatus('🟢 Live Synced');
                        }
                    }, (error) => {
                        console.error("Firebase sync error:", error);
                        setSyncStatus('🔴 Sync Error');
                    });

                } catch (err) {
                    console.error("Config parse error:", err);
                    setSyncStatus('⚠️ Invalid Config');
                }

                return () => {
                    if (unsubscribeRef.current) unsubscribeRef.current();
                };
            }, [isCloudSyncActive, firebaseConfigInput]);

            const updateCategoriesAndCloud = (newCategoriesOrUpdater) => {
                setCategories(prev => {
                    const nextVal = typeof newCategoriesOrUpdater === 'function' ? newCategoriesOrUpdater(prev) : newCategoriesOrUpdater;
                    if (isCloudSyncActive && dbRef.current) {
                        dbRef.current.collection('goal_trackers').doc('main_user_data')
                            .set({ categories: nextVal })
                            .catch(err => console.error("Cloud write error:", err));
                    }
                    return nextVal;
                });
            };

            const handlePrevDate = () => {
                const d = new Date(currentDate);
                if (view === 'daily') d.setDate(d.getDate() - 1);
                else if (view === 'weekly') d.setDate(d.getDate() - 7);
                else if (view === 'monthly') d.setMonth(d.getMonth() - 1);
                setCurrentDate(d.toISOString().split('T')[0]);
            };

            const handleNextDate = () => {
                const d = new Date(currentDate);
                if (view === 'daily') d.setDate(d.getDate() + 1);
                else if (view === 'weekly') d.setDate(d.getDate() + 7);
                else if (view === 'monthly') d.setMonth(d.getMonth() + 1);
                setCurrentDate(d.toISOString().split('T')[0]);
            };

            const handleToday = () => {
                setCurrentDate(new Date().toISOString().split('T')[0]);
            };

            const getDateKey = () => {
                if (view === 'daily') return currentDate;
                if (view === 'weekly') {
                    const d = new Date(currentDate);
                    const weekNum = Math.ceil(d.getDate() / 7);
                    return `${d.getFullYear()}-W${d.getMonth() + 1}-${weekNum}`;
                }
                if (view === 'monthly') {
                    const d = new Date(currentDate);
                    return `${d.getFullYear()}-${d.getMonth() + 1}`;
                }
                return currentDate;
            };

            const matchesNthWeekday = (dateStr, targetNth, targetDay) => {
                const d = new Date(dateStr);
                if (d.getDay() !== Number(targetDay)) return false;
                let count = 0;
                const temp = new Date(d.getFullYear(), d.getMonth(), 1);
                while (temp <= d) {
                    if (temp.getDay() === Number(targetDay)) count++;
                    temp.setDate(temp.getDate() + 1);
                }
                return count === Number(targetNth);
            };

            const taskOccursOnDate = (task, dateStr) => {
                const d = new Date(dateStr);
                const dayOfWeek = d.getDay();
                const type = task.freqType || task.frequency;

                if (type === 'daily') return true;
                if (type === 'weekdays') return dayOfWeek >= 1 && dayOfWeek <= 5;
                if (type === 'weekends') return dayOfWeek === 0 || dayOfWeek === 6;
                if (type === 'custom-weekly') {
                    const days = task.customDays || [];
                    return days.includes(dayOfWeek);
                }
                if (type === 'nth-weekday') {
                    return matchesNthWeekday(dateStr, task.nthWeek, task.nthDay);
                }
                if (type === 'one-off') {
                    return task.dueDate === dateStr;
                }
                return true;
            };

            const isTaskVisibleForView = (task) => {
                if (view === 'daily') {
                    return taskOccursOnDate(task, currentDate);
                }
                if (view === 'weekly') {
                    const curr = new Date(currentDate);
                    const firstDay = new Date(curr.setDate(curr.getDate() - curr.getDay()));
                    for (let i = 0; i < 7; i++) {
                        const checkDate = new Date(firstDay);
                        checkDate.setDate(checkDate.getDate() + i);
                        if (taskOccursOnDate(task, checkDate.toISOString().split('T')[0])) return true;
                    }
                    return false;
                }
                if (view === 'monthly') {
                    const curr = new Date(currentDate);
                    const year = curr.getFullYear();
                    const month = curr.getMonth();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    for (let day = 1; day <= daysInMonth; day++) {
                        const checkStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        if (taskOccursOnDate(task, checkStr)) return true;
                    }
                    return false;
                }
                return true;
            };

            const toggleTask = (catId, subId, taskId) => {
                const key = getDateKey();
                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== catId) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== subId) return sub;
                            return {
                                ...sub,
                                tasks: sub.tasks.map(task => {
                                    if (task.id !== taskId) return task;
                                    const currentStatus = !!task.completed[key];
                                    return {
                                        ...task,
                                        completed: { ...task.completed, [key]: !currentStatus }
                                    };
                                })
                            };
                        })
                    };
                }));
            };

            const deleteTask = (catId, subId, taskId) => {
                if (!confirm("Are you sure you want to delete this task?")) return;
                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== catId) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== subId) return sub;
                            return {
                                ...sub,
                                tasks: sub.tasks.filter(task => task.id !== taskId)
                            };
                        })
                    };
                }));
            };

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!newTaskName.trim()) return;

                const newTask = {
                    id: 'task_' + Date.now(),
                    name: newTaskName.trim(),
                    freqType: newTaskFreqType,
                    customDays: newTaskDays,
                    nthWeek: newTaskNthWeek,
                    nthDay: newTaskNthDay,
                    dueDate: newTaskFreqType === 'one-off' ? newTaskDueDate : null,
                    completed: {}
                };

                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== selectedCategory) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== selectedSubcomp) return sub;
                            return {
                                ...sub,
                                tasks: [...sub.tasks, newTask]
                            };
                        })
                    };
                }));

                setNewTaskName('');
                setIsTaskModalOpen(false);
            };

            const exportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(categories, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `goal_tracker_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const importBackup = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            updateCategoriesAndCloud(parsed);
                            alert("Data successfully restored and synced!");
                            setIsSyncModalOpen(false);
                        } catch (err) {
                            alert("Invalid backup file format.");
                        }
                    };
                }
            };

            const key = getDateKey();
            let totalTasks = 0;
            let completedTasks = 0;

            categories.forEach(cat => {
                cat.subcomponents.forEach(sub => {
                    sub.tasks.forEach(task => {
                        if (isTaskVisibleForView(task)) {
                            totalTasks++;
                            if (task.completed[key]) completedTasks++;
                        }
                    });
                });
            });

            const percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            const generateReportData = () => {
                let scopedCats = categories;
                if (!isMasterReport && reportCategoryScope !== 'all') {
                    scopedCats = categories.filter(c => c.id === reportCategoryScope);
                }

                let total = 0;
                let completed = 0;
                const catBreakdown = [];

                scopedCats.forEach(cat => {
                    let catTotal = 0;
                    let catDone = 0;
                    cat.subcomponents.forEach(sub => {
                        sub.tasks.forEach(task => {
                            catTotal++;
                            total++;
                            if (task.completed[key]) {
                                catDone++;
                                completed++;
                            }
                        });
                    });
                    catBreakdown.push({
                        name: cat.name,
                        total: catTotal,
                        done: catDone,
                        rate: catTotal > 0 ? Math.round((catDone / catTotal) * 100) : 0
                    });
                });

                const overallRate = total > 0 ? Math.round((completed / total) * 100) : 0;
                let feedback = overallRate >= 80 ? "🟢 Excellent execution. High consistency maintained." : overallRate >= 50 ? "🟡 Moderate momentum. Some recurring routines need attention." : "🔴 Low completion rate. Review task loads and bottlenecks.";
                return { total, completed, overallRate, catBreakdown, feedback };
            };

            const reportData = generateReportData();

            const getFreqLabel = (task) => {
                const type = task.freqType || task.frequency;
                if (type === 'daily') return 'Daily';
                if (type === 'weekdays') return 'Mon-Fri';
                if (type === 'weekends') return 'Weekends';
                if (type === 'custom-weekly') {
                    const map = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    return (task.customDays || []).map(d => map[d]).join(', ');
                }
                if (type === 'nth-weekday') {
                    const weeks = ['1st', '2nd', '3rd', '4th', '5th'];
                    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    return `${weeks[task.nthWeek - 1]} ${days[task.nthDay]}`;
                }
                if (type === 'one-off') return `Due: ${task.dueDate}`;
                return type;
            };

            return (
                <div className="max-w-5xl mx-auto p-4 sm:p-6">
                    {/* Header */}
                    <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <div className="flex items-center gap-3">
                                <h1 className="text-2xl font-bold text-slate-900">Goal & Task Tracker</h1>
                                <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${syncStatus.includes('Synced') ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-100 text-slate-600 border-slate-200'}`}>
                                    {syncStatus}
                                </span>
                            </div>
                            <p className="text-sm text-slate-500">Live multi-device sync, daily habits, and performance reports.</p>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap">
                            <div className="flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200">
                                <button onClick={handlePrevDate} title="Previous" className="p-1.5 hover:bg-white rounded-lg text-slate-600 transition shadow-sm font-bold text-xs">◀</button>
                                <button onClick={handleToday} className="px-2 text-xs font-semibold text-slate-700 hover:text-blue-600">Today</button>
                                <button onClick={handleNextDate} title="Next" className="p-1.5 hover:bg-white rounded-lg text-slate-600 transition shadow-sm font-bold text-xs">▶</button>
                            </div>
                            <input 
                                type="date" 
                                value={currentDate} 
                                onChange={e => setCurrentDate(e.target.value)}
                                className="px-3 py-2 border rounded-xl text-sm font-medium bg-slate-50 border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                            <button onClick={() => setIsReportModalOpen(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-2 rounded-xl text-sm transition shadow-sm">
                                📊 Reports
                            </button>
                            <button onClick={() => setIsSyncModalOpen(true)} className="bg-slate-800 hover:bg-slate-900 text-white font-medium px-3 py-2 rounded-xl text-sm transition shadow-sm">
                                ⚡ Cloud & Backup
                            </button>
                            <button onClick={() => setIsTaskModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-xl text-sm transition shadow-sm">
                                + Add Task
                            </button>
                        </div>
                    </header>

                    {/* View Switcher & Progress Bar */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                        <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                            <div className="inline-flex rounded-xl bg-slate-100 p-1">
                                <button onClick={() => setView('daily')} className={`px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'daily' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>Daily View</button>
                                <button onClick={() => setView('weekly')} className={`px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'weekly' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>Weekly View</button>
                                <button onClick={() => setView('monthly')} className={`px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'monthly' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>Monthly View</button>
                            </div>
                            <div className="text-right">
                                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">Completion Status ({view})</span>
                                <div className="text-lg font-bold text-slate-800">{completedTasks} / {totalTasks} Tasks ({percent}%)</div>
                            </div>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                            <div className="bg-blue-600 h-3 rounded-full transition-all duration-500" style={{ width: `${percent}%` }}></div>
                        </div>
                    </div>

                    {/* Categories Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {categories.map(cat => {
                            const hasVisible = cat.subcomponents.some(sub => sub.tasks.some(isTaskVisibleForView));
                            return (
                                <div key={cat.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                                    <div>
                                        <div className={`inline-block px-3 py-1 rounded-full text-xs font-semibold border mb-4 ${cat.color}`}>
                                            {cat.name}
                                        </div>
                                        <div className="space-y-4">
                                            {cat.subcomponents.map(sub => {
                                                const visibleSubTasks = sub.tasks.filter(isTaskVisibleForView);
                                                if (visibleSubTasks.length === 0) return null;
                                                return (
                                                    <div key={sub.id} className="border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                                                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">{sub.name}</h4>
                                                        <ul className="space-y-2">
                                                            {visibleSubTasks.map(task => {
                                                                const isChecked = !!task.completed[key];
                                                                return (
                                                                    <li key={task.id} className="flex items-center justify-between group">
                                                                        <label className="flex items-center gap-3 cursor-pointer select-none">
                                                                            <input 
                                                                                type="checkbox" 
                                                                                checked={isChecked}
                                                                                onChange={() => toggleTask(cat.id, sub.id, task.id)}
                                                                                className="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500"
                                                                            />
                                                                            <span className={`text-sm ${isChecked ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}`}>
                                                                                {task.name}
                                                                            </span>
                                                                        </label>
                                                                        <div className="flex items-center gap-2">
                                                                            <span className="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md font-medium">
                                                                                {getFreqLabel(task)}
                                                                            </span>
                                                                            <button 
                                                                                onClick={() => deleteTask(cat.id, sub.id, task.id)}
                                                                                title="Delete task"
                                                                                className="text-slate-300 hover:text-red-500 transition text-xs px-1 font-bold"
                                                                            >
                                                                                ✕
                                                                            </button>
                                                                        </div>
                                                                    </li>
                                                                );
                                                            })}
                                                        </ul>
                                                    </div>
                                                );
                                            })}
                                            {!hasVisible && (
                                                <p className="text-xs text-slate-400 italic py-2">No tasks scheduled for this {view}.</p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Add Task Modal */}
                    {isTaskModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-200">
                                <h3 className="text-lg font-bold text-slate-900 mb-4">Add Granular Task</h3>
                                <form onSubmit={handleAddTask} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Category</label>
                                        <select 
                                            value={selectedCategory} 
                                            onChange={e => {
                                                setSelectedCategory(e.target.value);
                                                const cat = categories.find(c => c.id === e.target.value);
                                                if (cat && cat.subcomponents.length > 0) setSelectedSubcomp(cat.subcomponents[0].id);
                                            }}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-50 border-slate-300"
                                        >
                                            {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Subcomponent</label>
                                        <select 
                                            value={selectedSubcomp} 
                                            onChange={e => setSelectedSubcomp(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-50 border-slate-300"
                                        >
                                            {categories.find(c => c.id === selectedCategory)?.subcomponents.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Task Name</label>
                                        <input 
                                            type="text" 
                                            placeholder="e.g. Weekly Review / Team Sync" 
                                            value={newTaskName}
                                            onChange={e => setNewTaskName(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-50 border-slate-300"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Recurrence Pattern</label>
                                        <select 
                                            value={newTaskFreqType} 
                                            onChange={e => setNewTaskFreqType(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-50 border-slate-300"
                                        >
                                            <option value="daily">Daily</option>
                                            <option value="weekdays">Weekdays (Mon - Fri)</option>
                                            <option value="weekends">Weekends (Sat & Sun)</option>
                                            <option value="custom-weekly">Weekly on Specific Days</option>
                                            <option value="nth-weekday">Nth Weekday of Month (e.g. 2nd Tuesday)</option>
                                            <option value="monthly">Monthly (Standard)</option>
                                            <option value="quarterly">Quarterly</option>
                                            <option value="yearly">Yearly</option>
                                            <option value="one-off">One-Off Task (Due Date)</option>
                                        </select>
                                    </div>

                                    {/* Custom Weekly Day Selector */}
                                    {newTaskFreqType === 'custom-weekly' && (
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Select Active Days</label>
                                            <div className="flex gap-1 justify-between">
                                                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((dayName, idx) => {
                                                    const isSelected = newTaskDays.includes(idx);
                                                    return (
                                                        <button
                                                            type="button"
                                                            key={idx}
                                                            onClick={() => {
                                                                if (isSelected) {
                                                                    setNewTaskDays(newTaskDays.filter(d => d !== idx));
                                                                } else {
                                                                    setNewTaskDays([...newTaskDays, idx]);
                                                                }
                                                            }}
                                                            className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${isSelected ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-300 hover:bg-slate-100'}`}
                                                        >
                                                            {dayName[0]}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {/* Nth Weekday Selector */}
                                    {newTaskFreqType === 'nth-weekday' && (
                                        <div className="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                            <div>
                                                <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Occurrence</label>
                                                <select 
                                                    value={newTaskNthWeek} 
                                                    onChange={e => setNewTaskNthWeek(Number(e.target.value))}
                                                    className="w-full px-2 py-1.5 border rounded-lg text-xs bg-white border-slate-300"
                                                >
                                                    <option value="1">1st of month</option>
                                                    <option value="2">2nd of month</option>
                                                    <option value="3">3rd of month</option>
                                                    <option value="4">4th of month</option>
                                                    <option value="5">5th of month</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Day of Week</label>
                                                <select 
                                                    value={newTaskNthDay} 
                                                    onChange={e => setNewTaskNthDay(Number(e.target.value))}
                                                    className="w-full px-2 py-1.5 border rounded-lg text-xs bg-white border-slate-300"
                                                >
                                                    <option value="0">Sunday</option>
                                                    <option value="1">Monday</option>
                                                    <option value="2">Tuesday</option>
                                                    <option value="3">Wednesday</option>
                                                    <option value="4">Thursday</option>
                                                    <option value="5">Friday</option>
                                                    <option value="6">Saturday</option>
                                                </select>
                                            </div>
                                        </div>
                                    )}

                                    {/* One-off Due Date */}
                                    {newTaskFreqType === 'one-off' && (
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Due By Date</label>
                                            <input 
                                                type="date" 
                                                value={newTaskDueDate}
                                                onChange={e => setNewTaskDueDate(e.target.value)}
                                                className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-50 border-slate-300"
                                                required
                                            />
                                        </div>
                                    )}

                                    <div className="flex justify-end gap-3 mt-6">
                                        <button type="button" onClick={() => setIsTaskModalOpen(false)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 shadow-sm">Save Task</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Report Generator Modal */}
                    {isReportModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 border border-slate-200 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold text-slate-900">📊 Performance & Analytical Report</h3>
                                    <button onClick={() => setIsReportModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                                </div>
                                <div className="space-y-4 mb-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Timeframe</label>
                                            <select value={reportTimeframe} onChange={e => setReportTimeframe(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-50 border-slate-300">
                                                <option value="weekly">Weekly Summary</option>
                                                <option value="monthly">Monthly Summary</option>
                                                <option value="quarterly">Quarterly Review</option>
                                                <option value="yearly">Yearly Overview</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Category Scope</label>
                                            <select 
                                                disabled={isMasterReport}
                                                value={reportCategoryScope} 
                                                onChange={e => setReportCategoryScope(e.target.value)} 
                                                className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-50 border-slate-300 disabled:opacity-50"
                                            >
                                                <option value="all">All Categories</option>
                                                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex flex-col justify-end">
                                            <label className="flex items-center gap-2 cursor-pointer bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                                <input 
                                                    type="checkbox"
                                                    checked={isMasterReport}
                                                    onChange={e => setIsMasterReport(e.target.checked)}
                                                    className="w-4 h-4 text-blue-600 rounded border-slate-300"
                                                />
                                                <span className="text-xs font-bold text-slate-700">Master Print All</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 space-y-3">
                                        <div className="flex justify-between items-center">
                                            <h4 className="font-bold text-slate-800 text-sm">Executive Overview ({reportTimeframe.toUpperCase()})</h4>
                                            {isMasterReport && <span className="text-[10px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-full">Master Report Mode</span>}
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 text-center">
                                            <div className="bg-white p-2 rounded-lg border border-slate-200">
                                                <span className="text-[10px] text-slate-400 uppercase font-semibold">Total</span>
                                                <div className="text-lg font-bold text-slate-800">{reportData.total}</div>
                                            </div>
                                            <div className="bg-white p-2 rounded-lg border border-slate-200">
                                                <span className="text-[10px] text-slate-400 uppercase font-semibold">Completed</span>
                                                <div className="text-lg font-bold text-emerald-600">{reportData.completed}</div>
                                            </div>
                                            <div className="bg-white p-2 rounded-lg border border-slate-200">
                                                <span className="text-[10px] text-slate-400 uppercase font-semibold">Rate %</span>
                                                <div className="text-lg font-bold text-blue-600">{reportData.overallRate}%</div>
                                            </div>
                                        </div>
                                        <div className="text-xs font-medium text-slate-700 bg-white p-3 rounded-lg border border-slate-200">
                                            <strong>Analytical Feedback:</strong> {reportData.feedback}
                                        </div>
                                    </div>

                                    <div>
                                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Category Breakdown</h4>
                                        <div className="space-y-2">
                                            {reportData.catBreakdown.map((cb, idx) => (
                                                <div key={idx} className="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center text-sm">
                                                    <span className="font-medium text-slate-700">{cb.name}</span>
                                                    <span className="text-xs font-semibold px-2 py-1 bg-slate-100 rounded-md text-slate-600">{cb.done} / {cb.total} ({cb.rate}%)</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">User Reflections & Notes</label>
                                        <textarea 
                                            rows="3" 
                                            placeholder="Add personal reflections or focus items..." 
                                            value={userReportNotes}
                                            onChange={e => setUserReportNotes(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-50 border-slate-300"
                                        ></textarea>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setIsReportModalOpen(false)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100">Close</button>
                                    <button onClick={() => window.print()} className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 shadow-sm">Print / Save as PDF</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Cloud Sync & Backup Modal */}
                    {isSyncModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 border border-slate-200 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">⚡ Firebase Cloud Sync & Backup</h3>
                                <p className="text-xs text-slate-500 mb-4">Paste your Firebase configuration object below (both standard JS object format and JSON are supported).</p>
                                
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Firebase Config Object</label>
                                        <textarea 
                                            rows="5"
                                            placeholder={`{ apiKey: "...", authDomain: "...", projectId: "...", ... }`}
                                            value={firebaseConfigInput}
                                            onChange={e => {
                                                setFirebaseConfigInput(e.target.value);
                                                localStorage.setItem('goal_tracker_fb_config', e.target.value);
                                            }}
                                            className="w-full px-3 py-2 border rounded-xl text-xs font-mono bg-slate-50 border-slate-300"
                                        ></textarea>
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <div>
                                            <div className="text-sm font-bold text-slate-800">Enable Live Cloud Sync</div>
                                            <div className="text-xs text-slate-500">Syncs automatically in real time across devices</div>
                                        </div>
                                        <input 
                                            type="checkbox"
                                            checked={isCloudSyncActive}
                                            onChange={e => {
                                                setIsCloudSyncActive(e.target.checked);
                                                localStorage.setItem('goal_tracker_cloud_active', e.target.checked ? 'true' : 'false');
                                            }}
                                            className="w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer"
                                        />
                                    </div>

                                    <div className="border-t pt-4 space-y-2">
                                        <div className="text-xs font-bold text-slate-700 uppercase tracking-wider">Manual JSON Backup</div>
                                        <div className="flex gap-2">
                                            <button onClick={exportBackup} className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-xs transition">
                                                📥 Export JSON
                                            </button>
                                            <label className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-xs transition text-center cursor-pointer">
                                                📤 Import JSON
                                                <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-end">
                                    <button onClick={() => setIsSyncModalOpen(false)} className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-700">Save & Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
