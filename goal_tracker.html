<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Category Goal & Task Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone for JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CATEGORY_COLORS = {
          'Family / Home': {
            bg: 'bg-emerald-950/40',
            border: 'border-emerald-800/50',
            text: 'text-emerald-400',
            accent: '#10b981',
            pill: 'bg-emerald-600 text-white'
          },
          'Church Calling': {
            bg: 'bg-indigo-950/40',
            border: 'border-indigo-800/50',
            text: 'text-indigo-400',
            accent: '#6366f1',
            pill: 'bg-indigo-600 text-white'
          },
          'Consulting': {
            bg: 'bg-amber-950/40',
            border: 'border-amber-800/50',
            text: 'text-amber-400',
            accent: '#f59e0b',
            pill: 'bg-amber-600 text-white'
          },
          'Self-Improvement': {
            bg: 'bg-sky-950/40',
            border: 'border-sky-800/50',
            text: 'text-sky-400',
            accent: '#0ea5e9',
            pill: 'bg-sky-600 text-white'
          }
        };

        const FREQUENCY_LABELS = {
          daily: 'Daily',
          weekly: 'Weekly',
          biweekly: '2x / Month',
          monthly: 'Monthly',
          quarterly: 'Quarterly',
          yearly: 'Yearly',
          oneoff: 'One-off Task'
        };

        const INITIAL_STRUCTURE = [
          {
            id: 'cat-1',
            name: 'Family / Home',
            subcomponents: [
              { id: 'sub-1-1', name: 'Maintenance' },
              { id: 'sub-1-2', name: 'Family Time' },
              { id: 'sub-1-3', name: 'Admin' }
            ]
          },
          {
            id: 'cat-2',
            name: 'Church Calling',
            subcomponents: [
              { id: 'sub-2-1', name: 'Ministering' },
              { id: 'sub-2-2', name: 'Activities' },
              { id: 'sub-2-3', name: 'Councils / Admin' }
            ]
          },
          {
            id: 'cat-3',
            name: 'Consulting',
            subcomponents: [
              { id: 'sub-3-1', name: 'Research / Analysis' },
              { id: 'sub-3-2', name: 'Marketing' },
              { id: 'sub-3-3', name: 'Professional Development' }
            ]
          },
          {
            id: 'cat-4',
            name: 'Self-Improvement',
            subcomponents: [
              { id: 'sub-4-1', name: 'Physical' },
              { id: 'sub-4-2', name: 'Spiritual' },
              { id: 'sub-4-3', name: 'Intellectual' }
            ]
          }
        ];

        const INITIAL_TASKS = [
          { id: 't-1', title: 'Teach kids something new', category: 'Family / Home', subcomponent: 'Family Time', frequency: 'weekly', targetCount: 1, notes: 'Focus on life skills or gospel themes' },
          { id: 't-2', title: 'Date Night with spouse', category: 'Family / Home', subcomponent: 'Family Time', frequency: 'monthly', targetCount: 1, notes: 'Plan in advance' },
          { id: 't-3', title: 'Minister to assigned families', category: 'Church Calling', subcomponent: 'Ministering', frequency: 'monthly', targetCount: 1, notes: 'Check in & visit' },
          { id: 't-4', title: 'Empower ministering district', category: 'Church Calling', subcomponent: 'Ministering', frequency: 'monthly', targetCount: 1, notes: 'Touch base with district leaders' },
          { id: 't-5', title: 'Empower presidency members in other districts', category: 'Church Calling', subcomponent: 'Ministering', frequency: 'monthly', targetCount: 1, notes: 'Support assigned presidency' },
          { id: 't-6', title: 'Update ministering assignments', category: 'Church Calling', subcomponent: 'Ministering', frequency: 'quarterly', targetCount: 1, notes: 'Review needs with Bishopric' },
          { id: 't-7', title: 'Plan EQ Activities', category: 'Church Calling', subcomponent: 'Activities', frequency: 'quarterly', targetCount: 1, notes: 'Organize quorum service/social' },
          { id: 't-8', title: 'Confirm with Sunday teacher', category: 'Church Calling', subcomponent: 'Councils / Admin', frequency: 'weekly', targetCount: 1, notes: 'Send lesson topic reminder' },
          { id: 't-9', title: 'Print Bulletin', category: 'Church Calling', subcomponent: 'Councils / Admin', frequency: 'weekly', targetCount: 1, notes: 'Prepare printed agenda/announcements' },
          { id: 't-10', title: 'EQ Spotlight preparation', category: 'Church Calling', subcomponent: 'Councils / Admin', frequency: 'weekly', targetCount: 1, notes: 'Select brother to spotlight' },
          { id: 't-11', title: 'EQ Presidency Meeting', category: 'Church Calling', subcomponent: 'Councils / Admin', frequency: 'monthly', targetCount: 1, notes: 'Agendas & presidency council' },
          { id: 't-12', title: 'Ward Council Meeting', category: 'Church Calling', subcomponent: 'Councils / Admin', frequency: 'biweekly', targetCount: 2, notes: '2x per month' },
          { id: 't-13', title: 'EQ / RS / Bishop Sync', category: 'Church Calling', subcomponent: 'Councils / Admin', frequency: 'biweekly', targetCount: 2, notes: '2x per month joint alignment' },
          { id: 't-14', title: 'Update lesson schedule', category: 'Church Calling', subcomponent: 'Councils / Admin', frequency: 'monthly', targetCount: 1, notes: 'Ensure next month is assigned' },
          { id: 't-15', title: 'Add 1 project to portfolio page', category: 'Consulting', subcomponent: 'Research / Analysis', frequency: 'monthly', targetCount: 1, notes: 'Document key findings & ROI' },
          { id: 't-16', title: 'Log 10 hours client work', category: 'Consulting', subcomponent: 'Research / Analysis', frequency: 'weekly', targetCount: 1, notes: 'Weekly target tracking' },
          { id: 't-17', title: 'Publish 1 LinkedIn Post', category: 'Consulting', subcomponent: 'Marketing', frequency: 'monthly', targetCount: 1, notes: 'Share industry insights' },
          { id: 't-18', title: 'Identify certificates / courses to pursue', category: 'Consulting', subcomponent: 'Professional Development', frequency: 'oneoff', dueDate: new Date().toISOString().split('T')[0], targetCount: 1, notes: 'Target new skills' },
          { id: 't-19', title: 'Complete Triathlon target', category: 'Self-Improvement', subcomponent: 'Physical', frequency: 'yearly', targetCount: 1, notes: 'Yearly milestone target' },
          { id: 't-20', title: 'Mobility / core training (15 mins)', category: 'Self-Improvement', subcomponent: 'Physical', frequency: 'daily', targetCount: 1, notes: 'Daily consistency' },
          { id: 't-21', title: '10 miles running total', category: 'Self-Improvement', subcomponent: 'Physical', frequency: 'weekly', targetCount: 1, notes: 'Weekly mileage build' },
          { id: 't-22', title: 'Swim session', category: 'Self-Improvement', subcomponent: 'Physical', frequency: 'weekly', targetCount: 1, notes: '1x weekly pool workout' },
          { id: 't-23', title: 'Attend Temple', category: 'Self-Improvement', subcomponent: 'Spiritual', frequency: 'monthly', targetCount: 1, notes: 'Monthly spiritual goal' },
          { id: 't-24', title: 'Scripture Study', category: 'Self-Improvement', subcomponent: 'Spiritual', frequency: 'daily', targetCount: 1, notes: 'Daily study' },
          { id: 't-25', title: 'Reading (30 min)', category: 'Self-Improvement', subcomponent: 'Intellectual', frequency: 'daily', targetCount: 1, notes: 'Daily reading goal' }
        ];

        function App() {
          const [categories, setCategories] = useState(() => {
            const saved = localStorage.getItem('goal_tracker_categories');
            return saved ? JSON.parse(saved) : INITIAL_STRUCTURE;
          });

          const [tasks, setTasks] = useState(() => {
            const saved = localStorage.getItem('goal_tracker_tasks');
            return saved ? JSON.parse(saved) : INITIAL_TASKS;
          });

          const [completionLogs, setCompletionLogs] = useState(() => {
            const saved = localStorage.getItem('goal_tracker_logs');
            return saved ? JSON.parse(saved) : {};
          });

          const [syncMode, setSyncMode] = useState(() => localStorage.getItem('goal_tracker_sync_mode') || 'local');
          const [syncRoomId, setSyncRoomId] = useState(() => localStorage.getItem('goal_tracker_room_id') || '');
          const [lastBackupTime, setLastBackupTime] = useState(() => localStorage.getItem('goal_tracker_last_backup_time') || null);
          const [showSyncModal, setShowSyncModal] = useState(false);
          const [customRoomInput, setCustomRoomInput] = useState('');

          const [currentView, setCurrentView] = useState('daily');
          const [selectedCategory, setSelectedCategory] = useState('All');
          const [selectedDateStr, setSelectedDateStr] = useState(() => new Date().toISOString().split('T')[0]);
          
          const [showNewTaskModal, setShowNewTaskModal] = useState(false);
          const [showNewSubModal, setShowNewSubModal] = useState(false);
          const [showReportModal, setShowReportModal] = useState(false);
          const [targetSubCatCategory, setTargetSubCatCategory] = useState('Family / Home');

          // Report Configuration States
          const [reportTimeframe, setReportTimeframe] = useState('weekly'); // weekly, monthly, quarterly
          const [reportScopeCategory, setReportScopeCategory] = useState('All');
          const [reportUserNotes, setReportUserNotes] = useState('');

          const [newTask, setNewTask] = useState({
            title: '',
            category: 'Family / Home',
            subcomponent: 'Maintenance',
            frequency: 'daily',
            dueDate: new Date().toISOString().split('T')[0],
            notes: ''
          });

          const [newSubName, setNewSubName] = useState('');

          // Automated Emergency Backup System
          const triggerAutoBackup = (cats, tks, logs) => {
            try {
              const fullState = {
                categories: cats,
                tasks: tks,
                completionLogs: logs,
                timestamp: new Date().toISOString()
              };
              localStorage.setItem('goal_tracker_auto_backup', JSON.stringify(fullState));
              const formattedTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
              setLastBackupTime(formattedTime);
              localStorage.setItem('goal_tracker_last_backup_time', formattedTime);
            } catch (err) {
              console.error("Auto backup failed:", err);
            }
          };

          useEffect(() => {
            localStorage.setItem('goal_tracker_categories', JSON.stringify(categories));
            localStorage.setItem('goal_tracker_tasks', JSON.stringify(tasks));
            localStorage.setItem('goal_tracker_logs', JSON.stringify(completionLogs));
            triggerAutoBackup(categories, tasks, completionLogs);
          }, [categories, tasks, completionLogs]);

          const restoreAutoBackup = () => {
            const backup = localStorage.getItem('goal_tracker_auto_backup');
            if (backup) {
              try {
                const parsed = JSON.parse(backup);
                if (parsed.categories) setCategories(parsed.categories);
                if (parsed.tasks) setTasks(parsed.tasks);
                if (parsed.completionLogs) setCompletionLogs(parsed.completionLogs);
                alert(`Data restored from auto-backup snapshot (${parsed.timestamp})!`);
              } catch (e) {
                alert("Failed to restore backup snapshot.");
              }
            } else {
              alert("No emergency auto-backup snapshot found.");
            }
          };

          const enableCloudSync = () => {
            const room = customRoomInput.trim() || `my-goals-${Math.floor(1000 + Math.random() * 9000)}`;
            setSyncRoomId(room);
            setSyncMode('cloud');
            localStorage.setItem('goal_tracker_room_id', room);
            localStorage.setItem('goal_tracker_sync_mode', 'cloud');
            setShowSyncModal(false);
          };

          const exportBackup = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ categories, tasks, completionLogs }));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `goal_tracker_backup_${selectedDateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
          };

          const selectedDate = useMemo(() => {
            const [y, m, d] = selectedDateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
          }, [selectedDateStr]);

          const todayStr = useMemo(() => new Date().toISOString().split('T')[0], []);

          const getWeekKey = (d) => {
            const tempDate = new Date(d.getTime());
            tempDate.setHours(0, 0, 0, 0);
            tempDate.setDate(tempDate.getDate() + 4 - (tempDate.getDay() || 7));
            const yearStart = new Date(tempDate.getFullYear(), 0, 1);
            const weekNo = Math.ceil((((tempDate - yearStart) / 86400000) + 1) / 7);
            return `${tempDate.getFullYear()}-W${weekNo}`;
          };

          const currentWeekKey = useMemo(() => getWeekKey(selectedDate), [selectedDate]);
          const currentMonthStr = useMemo(() => selectedDateStr.substring(0, 7), [selectedDateStr]);

          const navigateDate = (direction) => {
            if (direction === 'today') {
              setSelectedDateStr(todayStr);
              return;
            }
            const d = new Date(selectedDate);
            if (currentView === 'daily' || currentView === 'all') {
              d.setDate(d.getDate() + (direction === 'next' ? 1 : -1));
            } else if (currentView === 'weekly') {
              d.setDate(d.getDate() + (direction === 'next' ? 7 : -7));
            } else if (currentView === 'monthly') {
              d.setMonth(d.getMonth() + (direction === 'next' ? 1 : -1));
            }
            setSelectedDateStr(d.toISOString().split('T')[0]);
          };

          const getTimeKey = (task) => {
            if (task.frequency === 'oneoff') return task.dueDate || selectedDateStr;
            if (task.frequency === 'daily') return selectedDateStr;
            if (task.frequency === 'weekly' || task.frequency === 'biweekly') return currentWeekKey;
            if (task.frequency === 'monthly' || task.frequency === 'quarterly' || task.frequency === 'yearly') return currentMonthStr;
            return selectedDateStr;
          };

          const toggleTaskCompletion = (task) => {
            const timeKey = getTimeKey(task);
            setCompletionLogs(prev => {
              const taskLogs = prev[task.id] || {};
              const isDone = taskLogs[timeKey];
              return {
                ...prev,
                [task.id]: {
                  ...taskLogs,
                  [timeKey]: !isDone
                }
              };
            });
          };

          const isTaskCompleted = (task) => {
            const timeKey = getTimeKey(task);
            return !!(completionLogs[task.id] && completionLogs[task.id][timeKey]);
          };

          const filteredTasks = useMemo(() => {
            return tasks.filter(task => {
              if (selectedCategory !== 'All' && task.category !== selectedCategory) return false;

              if (currentView === 'daily') {
                if (task.frequency === 'daily') return true;
                if (task.frequency === 'oneoff' && task.dueDate === selectedDateStr) return true;
                return false;
              }
              if (currentView === 'weekly') {
                if (task.frequency === 'weekly' || task.frequency === 'biweekly') return true;
                if (task.frequency === 'oneoff' && task.dueDate) {
                  const taskDate = new Date(task.dueDate + 'T00:00:00');
                  return getWeekKey(taskDate) === currentWeekKey;
                }
                return false;
              }
              if (currentView === 'monthly') {
                if (task.frequency === 'monthly' || task.frequency === 'quarterly' || task.frequency === 'yearly') return true;
                if (task.frequency === 'oneoff' && task.dueDate) {
                  return task.dueDate.substring(0, 7) === currentMonthStr;
                }
                return false;
              }
              return true;
            });
          }, [tasks, currentView, selectedCategory, selectedDateStr, currentWeekKey, currentMonthStr]);

          const metrics = useMemo(() => {
            const total = filteredTasks.length;
            if (total === 0) return { completed: 0, total: 0, percent: 0 };
            const completed = filteredTasks.filter(t => isTaskCompleted(t)).length;
            return { completed, total, percent: Math.round((completed / total) * 100) };
          }, [filteredTasks, completionLogs]);

          const categoryStats = useMemo(() => {
            return categories.map(cat => {
              const catTasks = filteredTasks.filter(t => t.category === cat.name);
              const total = catTasks.length;
              const completed = catTasks.filter(t => isTaskCompleted(t)).length;
              const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
              return { name: cat.name, total, completed, pct };
            });
          }, [categories, filteredTasks, completionLogs]);

          // Report Generation & Analytics Calculation
          const generatedReportData = useMemo(() => {
            let relevantTasks = tasks;
            if (reportScopeCategory !== 'All') {
              relevantTasks = tasks.filter(t => t.category === reportScopeCategory);
            }

            const totalRelevant = relevantTasks.length;
            const completedRelevant = relevantTasks.filter(t => isTaskCompleted(t)).length;
            const overallPct = totalRelevant > 0 ? Math.round((completedRelevant / totalRelevant) * 100) : 0;

            // Group by category analytics
            const categoryBreakdown = categories
              .filter(c => reportScopeCategory === 'All' || c.name === reportScopeCategory)
              .map(cat => {
                const cTasks = relevantTasks.filter(t => t.category === cat.name);
                const done = cTasks.filter(t => isTaskCompleted(t)).length;
                const total = cTasks.length;
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                return { name: cat.name, done, total, pct };
              });

            // Analytics / Performance Trends Identification
            const pendingTasks = relevantTasks.filter(t => !isTaskCompleted(t));
            const completedTasksList = relevantTasks.filter(t => isTaskCompleted(t));

            const strengths = [];
            const growthAreas = [];

            categoryBreakdown.forEach(cb => {
              if (cb.total > 0 && cb.pct >= 75) {
                strengths.push(`High performance in ${cb.name} (${cb.pct}% completed).`);
              } else if (cb.total > 0 && cb.pct < 50) {
                growthAreas.push(`Lagging in ${cb.name} (${cb.pct}% completed - ${cb.total - cb.done} tasks pending).`);
              }
            });

            if (strengths.length === 0) strengths.push('Consistent activity across active task areas.');
            if (growthAreas.length === 0) growthAreas.push('No significant category deficits detected!');

            return {
              timeframe: reportTimeframe,
              dateRange: selectedDateStr,
              totalRelevant,
              completedRelevant,
              overallPct,
              categoryBreakdown,
              strengths,
              growthAreas,
              pendingTasks,
              completedTasksList
            };
          }, [tasks, categories, completionLogs, reportTimeframe, reportScopeCategory, selectedDateStr]);

          const handleCreateTask = (e) => {
            e.preventDefault();
            if (!newTask.title.trim()) return;
            const created = {
              id: `task-${Date.now()}`,
              title: newTask.title,
              category: newTask.category,
              subcomponent: newTask.subcomponent,
              frequency: newTask.frequency,
              dueDate: newTask.frequency === 'oneoff' ? newTask.dueDate : undefined,
              notes: newTask.notes
            };
            setTasks(prev => [...prev, created]);
            setNewTask({ title: '', category: 'Family / Home', subcomponent: 'Maintenance', frequency: 'daily', dueDate: selectedDateStr, notes: '' });
            setShowNewTaskModal(false);
          };

          const handleCreateSubcomponent = (e) => {
            e.preventDefault();
            if (!newSubName.trim()) return;
            setCategories(prev => prev.map(cat => {
              if (cat.name === targetSubCatCategory) {
                return {
                  ...cat,
                  subcomponents: [...cat.subcomponents, { id: `sub-${Date.now()}`, name: newSubName.trim() }]
                };
              }
              return cat;
            }));
            setNewSubName('');
            setShowNewSubModal(false);
          };

          const deleteTask = (taskId) => {
            setTasks(prev => prev.filter(t => t.id !== taskId));
          };

          const currentCatSubcomponents = useMemo(() => {
            const found = categories.find(c => c.name === newTask.category);
            return found ? found.subcomponents : [];
          }, [categories, newTask.category]);

          return (
            <div className="min-h-screen bg-slate-900 text-slate-100 font-sans pb-12">
              <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-30 px-4 lg:px-8 py-4">
                <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                  <div>
                    <h1 className="text-xl font-bold text-white">Personal & Calling Goal Tracker</h1>
                    <p className="text-xs text-slate-400">Organized life, church calling, and consulting dashboard</p>
                  </div>

                  <div className="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                    <button onClick={() => navigateDate('prev')} className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
                      &lt;
                    </button>
                    <input
                      type="date"
                      value={selectedDateStr}
                      onChange={(e) => setSelectedDateStr(e.target.value)}
                      className="bg-slate-950 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg border border-slate-800 focus:outline-none"
                    />
                    <button onClick={() => navigateDate('next')} className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
                      &gt;
                    </button>
                    {selectedDateStr !== todayStr && (
                      <button onClick={() => navigateDate('today')} className="px-2.5 py-1.5 rounded-lg bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600/30 text-xs font-semibold">
                        Today
                      </button>
                    )}
                  </div>

                  <div className="flex items-center gap-2 flex-wrap w-full md:w-auto">
                    <button
                      onClick={() => setShowReportModal(true)}
                      className="flex-1 md:flex-none px-3 py-2 rounded-lg bg-emerald-950/80 hover:bg-emerald-900/80 text-emerald-300 text-sm font-medium border border-emerald-700/50 flex items-center justify-center gap-1.5"
                    >
                      📊 Reports & Analytics
                    </button>
                    <button
                      onClick={() => setShowSyncModal(true)}
                      className="flex-1 md:flex-none px-3 py-2 rounded-lg bg-indigo-950/80 hover:bg-indigo-900/80 text-indigo-300 text-sm font-medium border border-indigo-700/50"
                    >
                      {syncMode === 'cloud' ? '☁️ Cloud Live Sync' : '⚡ Cloud & Backups'}
                    </button>
                    <button
                      onClick={() => setShowNewSubModal(true)}
                      className="flex-1 md:flex-none px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium border border-slate-700"
                    >
                      + Subcomponent
                    </button>
                    <button
                      onClick={() => {
                        setNewTask(prev => ({ ...prev, dueDate: selectedDateStr }));
                        setShowNewTaskModal(true);
                      }}
                      className="flex-1 md:flex-none px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium shadow-md"
                    >
                      + New Goal
                    </button>
                  </div>
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 lg:px-8 pt-6 space-y-6">
                <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-3 px-4 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-2">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                    <span>Auto-Recovery Backup Guardrail: <strong className="text-slate-200">Active</strong></span>
                    {lastBackupTime && <span className="text-slate-500">(Saved at {lastBackupTime})</span>}
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={restoreAutoBackup} className="text-indigo-400 hover:text-indigo-300 underline font-medium">
                      Restore Emergency Auto-Backup
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {categoryStats.map((stat) => {
                    const style = CATEGORY_COLORS[stat.name] || {};
                    return (
                      <div key={stat.name} className={`p-4 rounded-xl border ${style.border} ${style.bg}`}>
                        <div className="flex items-center justify-between mb-2">
                          <span className={`text-xs font-semibold uppercase tracking-wider ${style.text}`}>{stat.name}</span>
                          <span className="text-xs font-bold text-slate-400">{stat.completed}/{stat.total}</span>
                        </div>
                        <div className="flex items-end justify-between">
                          <span className="text-2xl font-bold text-white">{stat.pct}%</span>
                          <span className="text-xs text-slate-400 mb-1">completed</span>
                        </div>
                        <div className="w-full bg-slate-800/60 rounded-full h-2 mt-3 overflow-hidden">
                          <div className="h-full rounded-full transition-all duration-500" style={{ width: `${stat.pct}%`, backgroundColor: style.accent }} />
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="bg-slate-950/60 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="flex items-center bg-slate-900 p-1 rounded-lg border border-slate-800 w-full md:w-auto">
                    {['daily', 'weekly', 'monthly', 'all'].map(v => (
                      <button
                        key={v}
                        onClick={() => setCurrentView(v)}
                        className={`flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium capitalize transition-all ${
                          currentView === v ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'
                        }`}
                      >
                        {v} View
                      </button>
                    ))}
                  </div>

                  <div className="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                    <button
                      onClick={() => setSelectedCategory('All')}
                      className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${
                        selectedCategory === 'All' ? 'bg-slate-200 text-slate-900 font-semibold' : 'bg-slate-800 text-slate-400'
                      }`}
                    >
                      All Categories
                    </button>
                    {categories.map(cat => (
                      <button
                        key={cat.id}
                        onClick={() => setSelectedCategory(cat.name)}
                        className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${
                          selectedCategory === cat.name
                            ? `${CATEGORY_COLORS[cat.name]?.pill || 'bg-indigo-500 text-white'}`
                            : 'bg-slate-800 text-slate-400'
                        }`}
                      >
                        {cat.name}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-6">
                  {categories
                    .filter(cat => selectedCategory === 'All' || selectedCategory === cat.name)
                    .map(cat => {
                      const categoryTasks = filteredTasks.filter(t => t.category === cat.name);
                      if (categoryTasks.length === 0) return null;
                      const theme = CATEGORY_COLORS[cat.name] || {};

                      return (
                        <div key={cat.id} className="bg-slate-950/70 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
                          <div className={`px-5 py-3 border-b border-slate-800 flex items-center justify-between ${theme.bg}`}>
                            <div className="flex items-center gap-2">
                              <span className="w-3 h-3 rounded-full" style={{ backgroundColor: theme.accent }} />
                              <h3 className="font-semibold text-slate-100 text-base">{cat.name}</h3>
                              <span className="text-xs text-slate-400 ml-2">
                                ({categoryTasks.filter(t => isTaskCompleted(t)).length}/{categoryTasks.length} done)
                              </span>
                            </div>
                          </div>

                          <div className="p-4 space-y-4">
                            {cat.subcomponents.map(sub => {
                              const subTasks = categoryTasks.filter(t => t.subcomponent === sub.name);
                              if (subTasks.length === 0) return null;

                              return (
                                <div key={sub.id} className="space-y-2">
                                  <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider pl-1">
                                    • {sub.name}
                                  </div>

                                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pl-2">
                                    {subTasks.map(task => {
                                      const completed = isTaskCompleted(task);
                                      return (
                                        <div
                                          key={task.id}
                                          className={`p-3.5 rounded-lg border flex items-start justify-between gap-3 ${
                                            completed ? 'bg-slate-900/40 border-slate-800/60 opacity-75' : 'bg-slate-900 border-slate-800'
                                          }`}
                                        >
                                          <div className="flex items-start gap-3 flex-1 min-w-0">
                                            <input
                                              type="checkbox"
                                              checked={completed}
                                              onChange={() => toggleTaskCompletion(task)}
                                              className="mt-1 w-4 h-4 accent-indigo-600 rounded cursor-pointer"
                                            />
                                            <div className="flex-1 min-w-0">
                                              <p className={`text-sm font-medium ${completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                                                {task.title}
                                              </p>
                                              {task.notes && <p className="text-xs text-slate-400 mt-1 truncate">{task.notes}</p>}
                                              <div className="flex items-center gap-2 mt-2">
                                                <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">
                                                  {FREQUENCY_LABELS[task.frequency] || task.frequency}
                                                </span>
                                              </div>
                                            </div>
                                          </div>

                                          <button
                                            onClick={() => deleteTask(task.id)}
                                            className="text-slate-600 hover:text-rose-400 p-1 text-xs"
                                          >
                                            ✕
                                          </button>
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                </div>
              </main>

              {/* Reports & Analytics Modal */}
              {showReportModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-3xl p-6 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <div>
                        <h2 className="text-lg font-bold text-white flex items-center gap-2">📊 Executive Performance & Analytical Report</h2>
                        <p className="text-xs text-slate-400">Configure parameters, view automated performance trends, and append reflection notes.</p>
                      </div>
                      <button onClick={() => setShowReportModal(false)} className="text-slate-400 hover:text-slate-200">✕</button>
                    </div>

                    {/* Controls & Configuration Options */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs">
                      <div>
                        <label className="block text-slate-400 font-medium mb-1">Report Timeframe</label>
                        <select
                          value={reportTimeframe}
                          onChange={e => setReportTimeframe(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none"
                        >
                          <option value="weekly">Weekly Summary</option>
                          <option value="monthly">Monthly Summary</option>
                          <option value="quarterly">Quarterly Performance</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-400 font-medium mb-1">Category Scope</label>
                        <select
                          value={reportScopeCategory}
                          onChange={e => setReportScopeCategory(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none"
                        >
                          <option value="All">All Categories</option>
                          {categories.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                        </select>
                      </div>
                    </div>

                    {/* Executive Summary Metrics */}
                    <div className="bg-indigo-950/30 border border-indigo-800/40 p-4 rounded-xl space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold uppercase tracking-wider text-indigo-400">Overall Completion Rate</span>
                        <span className="text-xl font-extrabold text-white">{generatedReportData.overallPct}%</span>
                      </div>
                      <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                        <div className="bg-indigo-500 h-2 rounded-full" style={{ width: `${generatedReportData.overallPct}%` }}></div>
                      </div>
                      <p className="text-xs text-slate-400">
                        Completed <strong className="text-slate-200">{generatedReportData.completedRelevant}</strong> out of <strong className="text-slate-200">{generatedReportData.totalRelevant}</strong> scheduled goals for this period.
                      </p>
                    </div>

                    {/* Category Breakdown Table */}
                    <div className="space-y-2">
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400">Category Breakdown</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {generatedReportData.categoryBreakdown.map(cb => (
                          <div key={cb.name} className="p-3 bg-slate-950 rounded-lg border border-slate-800 flex items-center justify-between">
                            <div>
                              <p className="text-xs font-semibold text-slate-200">{cb.name}</p>
                              <p className="text-[10px] text-slate-400">{cb.done}/{cb.total} tasks completed</p>
                            </div>
                            <span className="text-sm font-bold text-indigo-400">{cb.pct}%</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Automated Analytics & Insights */}
                    <div className="space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
                      <h4 className="text-xs font-bold uppercase tracking-wider text-amber-400">⚡ Performance Trends & Analytical Observations</h4>
                      <div className="space-y-2 text-xs">
                        <div>
                          <strong className="text-emerald-400">Key Strengths:</strong>
                          <ul className="list-disc pl-4 text-slate-300 mt-0.5 space-y-1">
                            {generatedReportData.strengths.map((s, idx) => <li key={idx}>{s}</li>)}
                          </ul>
                        </div>
                        <div className="pt-2">
                          <strong className="text-amber-400">Growth / Attention Needed:</strong>
                          <ul className="list-disc pl-4 text-slate-300 mt-0.5 space-y-1">
                            {generatedReportData.growthAreas.map((g, idx) => <li key={idx}>{g}</li>)}
                          </ul>
                        </div>
                      </div>
                    </div>

                    {/* User Notes Input Area */}
                    <div className="space-y-1.5">
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-400">
                        User Notes & Reflections (Will be included in exported report)
                      </label>
                      <textarea
                        rows={3}
                        placeholder="Add your reflections, blockers, key wins, or adjustments for next period..."
                        value={reportUserNotes}
                        onChange={e => setReportUserNotes(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                      />
                    </div>

                    {/* Actions */}
                    <div className="flex items-center justify-between border-t border-slate-800 pt-4">
                      <button
                        onClick={() => {
                          const textSummary = `GOAL TRACKER REPORT (${generatedReportData.timeframe.toUpperCase()})\nDate: ${generatedReportData.dateRange}\nOverall Progress: ${generatedReportData.overallPct}%\n\nNotes:\n${reportUserNotes || 'None'}`;
                          navigator.clipboard.writeText(textSummary);
                          alert('Report summary copied to clipboard!');
                        }}
                        className="px-3 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs font-medium hover:bg-slate-700"
                      >
                        📋 Copy Summary
                      </button>
                      
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => window.print()}
                          className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-medium hover:bg-indigo-500"
                        >
                          🖨️ Print / Save as PDF
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {showSyncModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-lg p-6 shadow-2xl space-y-5">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <h2 className="text-lg font-bold text-white">☁️ Live Cloud Sync & Backup Safety</h2>
                      <button onClick={() => setShowSyncModal(false)} className="text-slate-400">✕</button>
                    </div>

                    <div className="space-y-4 text-xs text-slate-300">
                      <div className="space-y-2">
                        <h4 className="font-semibold text-white">Connect iPhone & Laptop to Live Cloud Sync</h4>
                        <div className="flex items-center gap-2 pt-1">
                          <input
                            type="text"
                            placeholder="e.g. my-family-goals-2026"
                            value={customRoomInput}
                            onChange={e => setCustomRoomInput(e.target.value)}
                            className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none"
                          />
                          <button onClick={enableCloudSync} className="px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold">
                            Connect
                          </button>
                        </div>
                      </div>

                      <div className="border-t border-slate-800 pt-3 flex items-center justify-between">
                        <button onClick={exportBackup} className="text-indigo-400 underline font-medium">
                          Export Backup File (JSON)
                        </button>
                        <button onClick={restoreAutoBackup} className="px-3 py-1.5 bg-slate-800 text-slate-200 rounded-lg">
                          Restore Auto-Backup
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {showNewTaskModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md p-6 shadow-2xl space-y-4">
                    <h2 className="text-lg font-bold text-white">Create New Task</h2>
                    <form onSubmit={handleCreateTask} className="space-y-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Title</label>
                        <input
                          type="text"
                          required
                          value={newTask.title}
                          onChange={e => setNewTask({ ...newTask, title: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Category</label>
                          <select
                            value={newTask.category}
                            onChange={e => setNewTask({ ...newTask, category: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"
                          >
                            {categories.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Subcomponent</label>
                          <select
                            value={newTask.subcomponent}
                            onChange={e => setNewTask({ ...newTask, subcomponent: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"
                          >
                            {currentCatSubcomponents.map(sub => <option key={sub.id} value={sub.name}>{sub.name}</option>)}
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Frequency</label>
                        <select
                          value={newTask.frequency}
                          onChange={e => setNewTask({ ...newTask, frequency: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"
                        >
                          <option value="daily">Daily</option>
                          <option value="weekly">Weekly</option>
                          <option value="biweekly">2x / Month</option>
                          <option value="monthly">Monthly</option>
                          <option value="quarterly">Quarterly</option>
                          <option value="yearly">Yearly</option>
                          <option value="oneoff">One-off Task</option>
                        </select>
                      </div>
                      <div className="flex justify-end gap-3 pt-2">
                        <button type="button" onClick={() => setShowNewTaskModal(false)} className="px-4 py-2 text-xs text-slate-400">
                          Cancel
                        </button>
                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-medium">
                          Create
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {showNewSubModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md p-6 shadow-2xl space-y-4">
                    <h2 className="text-lg font-bold text-white">Add Subcomponent</h2>
                    <form onSubmit={handleCreateSubcomponent} className="space-y-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Category</label>
                        <select
                          value={targetSubCatCategory}
                          onChange={e => setTargetSubCatCategory(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"
                        >
                          {categories.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Subcomponent Name</label>
                        <input
                          type="text"
                          required
                          value={newSubName}
                          onChange={e => setNewSubName(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200"
                        />
                      </div>
                      <div className="flex justify-end gap-3 pt-2">
                        <button type="button" onClick={() => setShowNewSubModal(false)} className="px-4 py-2 text-xs text-slate-400">
                          Cancel
                        </button>
                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-medium">
                          Add Subcomponent
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
