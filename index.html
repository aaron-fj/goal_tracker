                                                                                        )}
                                                                                    </div>
                                                                                </div>
                                                                                <div className="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                                                                                    <div
                                                                                        className={`h-1.5 rounded-full transition-all duration-300 ${isChecked ? 'bg-emerald-500' : 'bg-blue-500'}`}
                                                                                        style={{ width: `${pctBar}%` }}
                                                                                    ></div>
                                                                                </div>
                                                                            </div>
                                                                        )}
                                                                    </li>
                                                                );
                                                            })}
                                                        </ul>
                                                    </div>
                                                );
                                            })}
                                            {!hasVisible && (
                                                <p className="text-xs text-slate-500 italic py-2">
                                                    {showArchived ? 'No archived tasks in this category.' : `No tasks scheduled in ${viewLabels[view]}.`}
                                                </p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Task Detail / Edit Modal (Recurrence, Due Date, Numeric Target, Comments, Archive) */}
                    {editingTaskCtx && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-800 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-white">Task Settings & Schedule</h3>
                                    <button onClick={() => setEditingTaskCtx(null)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                                </div>
                                <form onSubmit={handleSaveTaskDetails} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Task Name</label>
                                        <input 
                                            type="text" 
                                            value={editTaskName}
                                            onChange={e => setEditTaskName(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                            required
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Recurrence Pattern</label>
                                        <select 
                                            value={editTaskFreqType} 
                                            onChange={e => setEditTaskFreqType(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                        >
                                            <option value="daily">Daily</option>
                                            <option value="weekdays">Weekdays (Mon - Fri)</option>
                                            <option value="weekends">Weekends (Sat & Sun)</option>
                                            <option value="weekly">Weekly (Renews Monday Morning)</option>
                                            <option value="current-week">One-Time Task (Complete This Week)</option>
                                            <option value="custom-weekly">Weekly on Specific Days</option>
                                            <option value="nth-weekday">Specific Weeks & Days of Month (e.g. 2nd & 4th Tue)</option>
                                            <option value="monthly">Monthly (Renews 1st of Month)</option>
                                            <option value="quarterly">Quarterly</option>
                                            <option value="yearly">Yearly</option>
                                            <option value="one-off">One-Off Task (Specific Due Date)</option>
                                        </select>
                                    </div>

                                    {editTaskFreqType === 'custom-weekly' && (
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Select Active Days</label>
                                            <div className="flex gap-1 justify-between">
                                                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((dayName, idx) => {
                                                    const isSelected = editTaskDays.includes(idx);
                                                    return (
                                                        <button
                                                            type="button"
                                                            key={idx}
                                                            onClick={() => toggleNumberInArray(editTaskDays, setEditTaskDays, idx)}
                                                            className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${isSelected ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                        >
                                                            {dayName[0]}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {editTaskFreqType === 'nth-weekday' && (
                                        <div className="space-y-3 bg-slate-800/70 p-3 rounded-xl border border-slate-700">
                                            <div>
                                                <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Toggle Weeks of Month</label>
                                                <div className="flex gap-1.5">
                                                    {[
                                                        { val: 1, label: '1st' },
                                                        { val: 2, label: '2nd' },
                                                        { val: 3, label: '3rd' },
                                                        { val: 4, label: '4th' },
                                                        { val: 5, label: '5th' }
                                                    ].map(wk => {
                                                        const active = editTaskMultiWeeks.includes(wk.val);
                                                        return (
                                                            <button
                                                                type="button"
                                                                key={wk.val}
                                                                onClick={() => toggleNumberInArray(editTaskMultiWeeks, setEditTaskMultiWeeks, wk.val)}
                                                                className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${active ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                            >
                                                                {wk.label}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Toggle Day(s) of Week</label>
                                                <div className="flex gap-1">
                                                    {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((dName, idx) => {
                                                        const active = editTaskMultiDays.includes(idx);
                                                        return (
                                                            <button
                                                                type="button"
                                                                key={idx}
                                                                onClick={() => toggleNumberInArray(editTaskMultiDays, setEditTaskMultiDays, idx)}
                                                                className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${active ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                            >
                                                                {dName}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400">Target / Due Date (Optional)</label>
                                            {editTaskDueDate && (
                                                <button type="button" onClick={() => setEditTaskDueDate('')} className="text-[11px] text-red-400 hover:underline">
                                                    Clear Date
                                                </button>
                                            )}
                                        </div>
                                        <input 
                                            type="date" 
                                            value={editTaskDueDate}
                                            onChange={e => setEditTaskDueDate(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700 [color-scheme:dark]"
                                        />
                                    </div>

                                    {/* Optional Numeric Target & Unit */}
                                    <div className="grid grid-cols-2 gap-3 bg-slate-800/50 p-3 rounded-xl border border-slate-700/80">
                                        <div>
                                            <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Numeric Goal Target (Opt.)</label>
                                            <input 
                                                type="number" 
                                                step="any"
                                                min="0"
                                                placeholder="e.g. 10"
                                                value={editTaskTargetValue}
                                                onChange={e => setEditTaskTargetValue(e.target.value)}
                                                className="w-full px-3 py-1.5 border rounded-lg text-sm bg-slate-900 text-slate-100 placeholder-slate-500 border-slate-700"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Unit Label (Opt.)</label>
                                            <input 
                                                type="text" 
                                                placeholder="e.g. mi, hrs, pages"
                                                value={editTaskTargetUnit}
                                                onChange={e => setEditTaskTargetUnit(e.target.value)}
                                                className="w-full px-3 py-1.5 border rounded-lg text-sm bg-slate-900 text-slate-100 placeholder-slate-500 border-slate-700"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Comments / Notes</label>
                                        <textarea 
                                            rows="3"
                                            placeholder="Add progress notes, details, or context..."
                                            value={editTaskComments}
                                            onChange={e => setEditTaskComments(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700"
                                        ></textarea>
                                    </div>

                                    {/* Discontinue / Archive Toggle */}
                                    <div className="flex items-center justify-between bg-amber-950/30 p-3.5 rounded-xl border border-amber-800/70">
                                        <div>
                                            <div className="text-xs font-bold text-amber-300">Discontinue / Archive Task</div>
                                            <div className="text-[11px] text-slate-400">Hides from daily/weekly lists while preserving past history</div>
                                        </div>
                                        <input 
                                            type="checkbox"
                                            checked={editTaskArchived}
                                            onChange={e => setEditTaskArchived(e.target.checked)}
                                            className="w-5 h-5 text-amber-500 bg-slate-900 rounded border-slate-600 focus:ring-amber-500 cursor-pointer"
                                        />
                                    </div>

                                    <div className="flex justify-end gap-3 mt-6">
                                        <button type="button" onClick={() => setEditingTaskCtx(null)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800">Cancel</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 shadow-sm">Save Changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Add Task Modal */}
                    {isTaskModalOpen && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-800 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-lg font-bold text-white mb-4">Add Granular Task</h3>
                                <form onSubmit={handleAddTask} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Category</label>
                                        <select 
                                            value={selectedCategory} 
                                            onChange={e => {
                                                setSelectedCategory(e.target.value);
                                                const cat = categories.find(c => c.id === e.target.value);
                                                if (cat && cat.subcomponents.length > 0) setSelectedSubcomp(cat.subcomponents[0].id);
                                            }}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                        >
                                            {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Subcomponent</label>
                                        <select 
                                            value={selectedSubcomp} 
                                            onChange={e => setSelectedSubcomp(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                        >
                                            {categories.find(c => c.id === selectedCategory)?.subcomponents.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Task Name</label>
                                        <input 
                                            type="text" 
                                            placeholder="e.g. Weekly Review / Team Sync" 
                                            value={newTaskName}
                                            onChange={e => setNewTaskName(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Recurrence Pattern</label>
                                        <select 
                                            value={newTaskFreqType} 
                                            onChange={e => setNewTaskFreqType(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                        >
                                            <option value="daily">Daily</option>
                                            <option value="weekdays">Weekdays (Mon - Fri)</option>
                                            <option value="weekends">Weekends (Sat & Sun)</option>
                                            <option value="weekly">Weekly (Renews Monday Morning)</option>
                                            <option value="current-week">One-Time Task (Complete This Week)</option>
                                            <option value="custom-weekly">Weekly on Specific Days</option>
                                            <option value="nth-weekday">Specific Weeks & Days of Month (e.g. 2nd & 4th Tue)</option>
                                            <option value="monthly">Monthly (Renews 1st of Month)</option>
                                            <option value="quarterly">Quarterly</option>
                                            <option value="yearly">Yearly</option>
                                            <option value="one-off">One-Off Task (Specific Due Date)</option>
                                        </select>
                                    </div>

                                    {/* Custom Weekly Day Selector */}
                                    {newTaskFreqType === 'custom-weekly' && (
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Select Active Days</label>
                                            <div className="flex gap-1 justify-between">
                                                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((dayName, idx) => {
                                                    const isSelected = newTaskDays.includes(idx);
                                                    return (
                                                        <button
                                                            type="button"
                                                            key={idx}
                                                            onClick={() => toggleNumberInArray(newTaskDays, setNewTaskDays, idx)}
                                                            className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${isSelected ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                        >
                                                            {dayName[0]}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {/* Multi-Week & Multi-Day Monthly Selector */}
                                    {newTaskFreqType === 'nth-weekday' && (
                                        <div className="space-y-3 bg-slate-800/70 p-3 rounded-xl border border-slate-700">
                                            <div>
                                                <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Toggle Weeks of Month</label>
                                                <div className="flex gap-1.5">
                                                    {[
                                                        { val: 1, label: '1st' },
                                                        { val: 2, label: '2nd' },
                                                        { val: 3, label: '3rd' },
                                                        { val: 4, label: '4th' },
                                                        { val: 5, label: '5th' }
                                                    ].map(wk => {
                                                        const active = newTaskMultiWeeks.includes(wk.val);
                                                        return (
                                                            <button
                                                                type="button"
                                                                key={wk.val}
                                                                onClick={() => toggleNumberInArray(newTaskMultiWeeks, setNewTaskMultiWeeks, wk.val)}
                                                                className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${active ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                            >
                                                                {wk.label}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Toggle Day(s) of Week</label>
                                                <div className="flex gap-1">
                                                    {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((dName, idx) => {
                                                        const active = newTaskMultiDays.includes(idx);
                                                        return (
                                                            <button
                                                                type="button"
                                                                key={idx}
                                                                onClick={() => toggleNumberInArray(newTaskMultiDays, setNewTaskMultiDays, idx)}
                                                                className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${active ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                            >
                                                                {dName}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            <p className="text-[11px] text-slate-400">
                                                Tip: Select <strong>1st & 3rd</strong> or <strong>2nd & 4th</strong> to repeat every other week.
                                            </p>
                                        </div>
                                    )}

                                    {/* One-off Due Date */}
                                    {newTaskFreqType === 'one-off' && (
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Due By Date</label>
                                            <input 
                                                type="date" 
                                                value={newTaskDueDate}
                                                onChange={e => setNewTaskDueDate(e.target.value)}
                                                className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700 [color-scheme:dark]"
                                                required
                                            />
                                        </div>
                                    )}

                                    {/* Optional Numeric Target & Unit */}
                                    <div className="grid grid-cols-2 gap-3 bg-slate-800/50 p-3 rounded-xl border border-slate-700/80">
                                        <div>
                                            <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Numeric Goal Target (Opt.)</label>
                                            <input 
                                                type="number" 
                                                step="any"
                                                min="0"
                                                placeholder="e.g. 10"
                                                value={newTaskTargetValue}
                                                onChange={e => setNewTaskTargetValue(e.target.value)}
                                                className="w-full px-3 py-1.5 border rounded-lg text-sm bg-slate-900 text-slate-100 placeholder-slate-500 border-slate-700"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Unit Label (Opt.)</label>
                                            <input 
                                                type="text" 
                                                placeholder="e.g. mi, hrs, pages"
                                                value={newTaskTargetUnit}
                                                onChange={e => setNewTaskTargetUnit(e.target.value)}
                                                className="w-full px-3 py-1.5 border rounded-lg text-sm bg-slate-900 text-slate-100 placeholder-slate-500 border-slate-700"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Initial Comment / Note (Optional)</label>
                                        <textarea 
                                            rows="2"
                                            placeholder="Optional task context..."
                                            value={newTaskComments}
                                            onChange={e => setNewTaskComments(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700"
                                        ></textarea>
                                    </div>

                                    <div className="flex justify-end gap-3 mt-6">
                                        <button type="button" onClick={() => setIsTaskModalOpen(false)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800">Cancel</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 shadow-sm">Save Task</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Preset Templates Modal */}
                    {isTemplateModalOpen && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-800 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-lg font-bold text-white">✨ Goal & Routine Template Presets</h3>
                                    <button onClick={() => setIsTemplateModalOpen(false)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                                </div>
                                <p className="text-xs text-slate-400 mb-4">Quickly populate proven multi-task routines into any category and subcomponent.</p>
                                <form onSubmit={handleApplyTemplate} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Choose a Routine Bundle</label>
                                        <div className="space-y-2">
                                            {TASK_PRESET_TEMPLATES.map(tpl => (
                                                <label
                                                    key={tpl.id}
                                                    className={`block p-3 rounded-xl border cursor-pointer transition ${
                                                        selectedTemplateId === tpl.id
                                                            ? 'bg-indigo-950/50 border-indigo-500'
                                                            : 'bg-slate-800/60 border-slate-700 hover:border-slate-600'
                                                    }`}
                                                >
                                                    <div className="flex items-center gap-2">
                                                        <input
                                                            type="radio"
                                                            name="templatePreset"
                                                            checked={selectedTemplateId === tpl.id}
                                                            onChange={() => setSelectedTemplateId(tpl.id)}
                                                            className="text-indigo-500 bg-slate-900 border-slate-600"
                                                        />
                                                        <span className="text-sm font-bold text-white">{tpl.name}</span>
                                                    </div>
                                                    <p className="text-xs text-slate-400 mt-1 ml-5">{tpl.description}</p>
                                                    <ul className="mt-2 ml-5 space-y-1">
                                                        {tpl.tasks.map((t, i) => (
                                                            <li key={i} className="text-[11px] text-slate-300 flex items-center gap-1.5">
                                                                <span className="text-indigo-400">•</span> {t.name}
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Target Category</label>
                                            <select
                                                value={templateTargetCat}
                                                onChange={e => {
                                                    setTemplateTargetCat(e.target.value);
                                                    const cat = categories.find(c => c.id === e.target.value);
                                                    if (cat && cat.subcomponents.length > 0) setTemplateTargetSub(cat.subcomponents[0].id);
                                                }}
                                                className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                            >
                                                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Subcomponent</label>
                                            <select
                                                value={templateTargetSub}
                                                onChange={e => setTemplateTargetSub(e.target.value)}
                                                className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                            >
                                                {categories.find(c => c.id === templateTargetCat)?.subcomponents.map(s => (
                                                    <option key={s.id} value={s.id}>{s.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="flex justify-end gap-3 mt-6">
                                        <button type="button" onClick={() => setIsTemplateModalOpen(false)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800">Cancel</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-500 shadow-sm">Apply Template</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Report Generator Modal */}
                    {isReportModalOpen && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-3xl w-full p-6 border border-slate-800 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <div>
                                        <h3 className="text-xl font-bold text-white">📊 In-Depth Analytical & Trend Report</h3>
                                        <p className="text-xs text-slate-400">
                                            Active Filter: <strong className="text-slate-200">{isMasterReport ? 'All Tasks (Master Override)' : viewLabels[view]}</strong> • Date: <strong className="text-slate-200">{currentDate}</strong>
                                        </p>
                                    </div>
                                    <button onClick={() => setIsReportModalOpen(false)} className="text-slate-400 hover:text-slate-200 text-lg font-bold">✕</button>
                                </div>
                                <div className="space-y-4 mb-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Timeframe</label>
                                            <select value={reportTimeframe} onChange={e => setReportTimeframe(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700">
                                                <option value="weekly">Weekly Summary</option>
                                                <option value="monthly">Monthly Summary</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Category Scope</label>
                                            <select 
                                                disabled={isMasterReport}
                                                value={reportCategoryScope} 
                                                onChange={e => setReportCategoryScope(e.target.value)} 
                                                className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700 disabled:opacity-50"
                                            >
                                                <option value="all">All Categories</option>
                                                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex flex-col justify-end">
                                            <label className="flex items-center gap-2 cursor-pointer bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                                                <input 
                                                    type="checkbox"
                                                    checked={isMasterReport}
                                                    onChange={e => setIsMasterReport(e.target.checked)}
                                                    className="w-4 h-4 text-blue-500 bg-slate-900 rounded border-slate-600"
                                                />
                                                <span className="text-xs font-bold text-slate-200">Master Print All</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div className="bg-slate-800/70 rounded-xl p-4 border border-slate-700/80 space-y-3">
                                        <div className="flex justify-between items-center">
                                            <h4 className="font-bold text-slate-100 text-sm">Executive Overview & Trend Analysis</h4>
                                            {isMasterReport && <span className="text-[10px] bg-blue-950 text-blue-300 border border-blue-800 font-bold px-2 py-0.5 rounded-full">Master Report Mode</span>}
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 text-center">
                                            <div className="bg-slate-900 p-2 rounded-lg border border-slate-800">
                                                <span className="text-[10px] text-slate-400 uppercase font-semibold">Total Tasks</span>
                                                <div className="text-lg font-bold text-slate-100">{reportData.total}</div>
                                            </div>
                                            <div className="bg-slate-900 p-2 rounded-lg border border-slate-800">
                                                <span className="text-[10px] text-slate-400 uppercase font-semibold">Completed</span>
                                                <div className="text-lg font-bold text-emerald-400">{reportData.completed}</div>
                                            </div>
                                            <div className="bg-slate-900 p-2 rounded-lg border border-slate-800">
                                                <span className="text-[10px] text-slate-400 uppercase font-semibold">Execution Rate</span>
                                                <div className="text-lg font-bold text-blue-400">{reportData.overallRate}%</div>
                                            </div>
                                        </div>
                                        <div className="text-xs font-semibold text-cyan-300 bg-slate-900 p-3 rounded-lg border border-slate-800">
                                            {reportData.trendComparisonMsg}
                                        </div>
                                        <div className="text-xs font-medium text-slate-200 bg-slate-900 p-3 rounded-lg border border-slate-800">
                                            <strong className="text-white">Analytical Feedback:</strong> {reportData.feedback}
                                        </div>
                                    </div>

                                    {/* Historical Period Comparison Table */}
                                    <div>
                                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Historical Period Trends (Past 3 Periods)</h4>
                                        <div className="grid grid-cols-3 gap-2">
                                            {reportData.historicalStats.map((hs, idx) => (
                                                <div key={idx} className="bg-slate-800/60 p-3 rounded-xl border border-slate-800 text-center text-xs">
                                                    <div className="text-[10px] text-slate-400 font-mono mb-1">{hs.periodKey}</div>
                                                    <div className="font-bold text-slate-200">{hs.done} / {hs.total} completed</div>
                                                    <div className="text-blue-400 font-bold mt-0.5">{hs.rate}%</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Sub-component & Pattern Breakdown */}
                                    <div>
                                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Sub-Component Deep Dive & Bottlenecks</h4>
                                        <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                            {reportData.subcompBreakdown.map((sc, idx) => (
                                                <div key={idx} className="bg-slate-800/60 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-sm">
                                                    <div>
                                                        <span className="font-medium text-slate-200">{sc.name}</span>
                                                        <span className="text-[10px] text-slate-400 ml-2">({sc.categoryName})</span>
                                                    </div>
                                                    <span className={`text-xs font-semibold px-2 py-1 rounded-md border ${sc.rate >= 80 ? 'bg-emerald-950 text-emerald-300 border-emerald-800' : sc.rate >= 40 ? 'bg-amber-950 text-amber-300 border-amber-800' : 'bg-rose-950 text-rose-300 border-rose-800'}`}>
                                                        {sc.done} / {sc.total} ({sc.rate}%)
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                        {reportData.topSubcomp && reportData.bottleneckSubcomp && (
                                            <div className="mt-2 text-xs text-slate-400 bg-slate-800/40 p-3 rounded-xl border border-slate-800 flex flex-col gap-1">
                                                <div>🏆 <strong className="text-emerald-300">Strongest Sub-Component:</strong> {reportData.topSubcomp.name} ({reportData.topSubcomp.rate}%)</div>
                                                <div>⚠️ <strong className="text-rose-300">Potential Bottleneck:</strong> {reportData.bottleneckSubcomp.name} ({reportData.bottleneckSubcomp.rate}%)</div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Completed vs Incomplete Task Lists */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="bg-emerald-950/30 border border-emerald-800/70 rounded-xl p-3.5">
                                            <h4 className="text-xs font-bold uppercase tracking-wider text-emerald-300 mb-2 flex justify-between items-center">
                                                <span>✅ Completed Tasks</span>
                                                <span className="bg-emerald-900 text-emerald-200 px-2 py-0.5 rounded-full text-[10px]">{reportData.completedList.length}</span>
                                            </h4>
                                            {reportData.completedList.length === 0 ? (
                                                <p className="text-xs text-slate-500 italic">No completed tasks in this view.</p>
                                            ) : (
                                                <ul className="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                                                    {reportData.completedList.map(item => (
                                                        <li key={item.id} className="bg-slate-900 p-2 rounded-lg border border-emerald-900/60 text-xs">
                                                            <div className="font-semibold text-slate-100">{item.name}</div>
                                                            <div className="text-[10px] text-slate-400">{item.categoryName} • {item.freqLabel}</div>
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                        </div>

                                        <div className="bg-rose-950/30 border border-rose-800/70 rounded-xl p-3.5">
                                            <h4 className="text-xs font-bold uppercase tracking-wider text-rose-300 mb-2 flex justify-between items-center">
                                                <span>⏳ Incomplete Tasks</span>
                                                <span className="bg-rose-900 text-rose-200 px-2 py-0.5 rounded-full text-[10px]">{reportData.incompleteList.length}</span>
                                            </h4>
                                            {reportData.incompleteList.length === 0 ? (
                                                <p className="text-xs text-slate-500 italic">All tasks completed!</p>
                                            ) : (
                                                <ul className="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                                                    {reportData.incompleteList.map(item => (
                                                        <li key={item.id} className={`p-2 rounded-lg border text-xs ${item.overdue ? 'bg-red-950/60 border-red-700' : 'bg-slate-900 border-rose-900/60'}`}>
                                                            <div className="flex items-center justify-between gap-1">
                                                                <span className="font-semibold text-slate-100">{item.name}</span>
                                                                {item.overdue && <span className="text-[9px] font-bold bg-red-600 text-white px-1.5 py-0.5 rounded uppercase">Overdue</span>}
                                                            </div>
                                                            <div className="text-[10px] text-slate-400">{item.categoryName} • {item.freqLabel}</div>
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">User Reflections & Notes</label>
                                        <textarea 
                                            rows="3" 
                                            placeholder="Add personal reflections or focus items..." 
                                            value={userReportNotes}
                                            onChange={e => setUserReportNotes(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700"
                                        ></textarea>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setIsReportModalOpen(false)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800">Close</button>
                                    <button onClick={() => window.print()} className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 shadow-sm">Print / Save as PDF</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Cloud Sync & Backup Modal */}
                    {isSyncModalOpen && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-800 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-lg font-bold text-white mb-2">⚡ Firebase Cloud Sync & Backup</h3>
                                <p className="text-xs text-slate-400 mb-4">Paste your Firebase configuration object below (both standard JS object format and JSON are supported).</p>
                                
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Firebase Config Object</label>
                                        <textarea 
                                            rows="5"
                                            placeholder={`{ apiKey: "...", authDomain: "...", projectId: "...", ... }`}
                                            value={firebaseConfigInput}
                                            onChange={e => {
                                                setFirebaseConfigInput(e.target.value);
                                                localStorage.setItem('goal_tracker_fb_config', e.target.value);
                                            }}
                                            className="w-full px-3 py-2 border rounded-xl text-xs font-mono bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700"
                                        ></textarea>
                                    </div>

                                    <div className="flex items-center justify-between bg-slate-800/70 p-4 rounded-xl border border-slate-700">
                                        <div>
                                            <div className="text-sm font-bold text-slate-100">Enable Live Cloud Sync</div>
                                            <div className="text-xs text-slate-400">Syncs automatically in real time across devices</div>
                                        </div>
                                        <input 
                                            type="checkbox"
                                            checked={isCloudSyncActive}
                                            onChange={e => {
                                                setIsCloudSyncActive(e.target.checked);
                                                localStorage.setItem('goal_tracker_cloud_active', e.target.checked ? 'true' : 'false');
                                            }}
                                            className="w-5 h-5 text-blue-500 bg-slate-900 rounded border-slate-600 focus:ring-blue-500 cursor-pointer"
                                        />
                                    </div>

                                    <div className="border-t border-slate-800 pt-4 space-y-2">
                                        <div className="text-xs font-bold text-slate-300 uppercase tracking-wider">Manual JSON Backup</div>
                                        <div className="flex gap-2">
                                            <button onClick={exportBackup} className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium rounded-xl text-xs transition">
                                                📥 Export JSON
                                            </button>
                                            <label className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium rounded-xl text-xs transition text-center cursor-pointer">
                                                📤 Import JSON
                                                <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-end">
                                    <button onClick={() => setIsSyncModalOpen(false)} className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-500">Save & Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Custom Delete Confirmation Modal */}
                    {confirmDialog && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-slate-800">
                                <h3 className="text-lg font-bold text-white mb-2">{confirmDialog.title}</h3>
                                <p className="text-sm text-slate-300 mb-6">{confirmDialog.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800">Cancel</button>
                                    <button onClick={confirmDialog.onConfirm} className="px-4 py-2 rounded-xl text-sm font-medium bg-red-600 text-white hover:bg-red-500">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
