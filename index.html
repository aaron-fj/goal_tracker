<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Category Goal & Task Tracker with Master Reports</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase App & Firestore Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-blue-500/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Default initial category and task structure with dark-mode styling
        const initialCategories = [
            {
                id: 'family',
                name: '1. Family / Home',
                color: 'bg-emerald-950/70 text-emerald-300 border-emerald-800/80',
                subcomponents: [
                    { id: 'maint', name: 'Maintenance', tasks: [] },
                    { 
                        id: 'fam_time', 
                        name: 'Family Time', 
                        tasks: [
                            { id: 't1', name: 'Teach kids something new', freqType: 'weekly', completed: {}, comments: '', archived: false },
                            { id: 't2', name: 'Date night', freqType: 'monthly', completed: {}, comments: '', archived: false }
                        ] 
                    },
                    { id: 'admin', name: 'Admin', tasks: [] }
                ]
            },
            {
                id: 'church',
                name: '2. Church Calling',
                color: 'bg-indigo-950/70 text-indigo-300 border-indigo-800/80',
                subcomponents: [
                    { 
                        id: 'ministering', 
                        name: 'Ministering', 
                        tasks: [
                            { id: 'c1', name: 'Minister to assigned families', freqType: 'monthly', completed: {}, comments: '', archived: false },
                            { id: 'c2', name: 'Empower ministering district', freqType: 'monthly', completed: {}, comments: '', archived: false }
                        ] 
                    },
                    { 
                        id: 'councils', 
                        name: 'Councils / Admin', 
                        tasks: [
                            { id: 'c6', name: 'Confirm with teacher', freqType: 'weekly', completed: {}, comments: '', archived: false },
                            { id: 'c7', name: 'Print Bulletin', freqType: 'weekly', completed: {}, comments: '', archived: false }
                        ] 
                    }
                ]
            },
            {
                id: 'consulting',
                name: '3. Consulting',
                color: 'bg-amber-950/70 text-amber-300 border-amber-800/80',
                subcomponents: [
                    { 
                        id: 'research', 
                        name: 'Research / Analysis', 
                        tasks: [
                            { id: 'con2', name: '10 hours / week logged', freqType: 'weekly', targetValue: 10, targetUnit: 'hrs', progress: {}, completed: {}, comments: '', archived: false }
                        ] 
                    }
                ]
            },
            {
                id: 'self_imp',
                name: '4. Self-Improvement',
                color: 'bg-sky-950/70 text-sky-300 border-sky-800/80',
                subcomponents: [
                    { 
                        id: 'physical', 
                        name: 'Physical', 
                        tasks: [
                            { id: 's2', name: 'Mobility / core training (15 min)', freqType: 'daily', completed: {}, comments: '', archived: false },
                            { id: 's3', name: '10 miles running', freqType: 'weekly', targetValue: 10, targetUnit: 'mi', progress: {}, completed: {}, comments: '', archived: false }
                        ] 
                    }
                ]
            }
        ];

        // Parse YYYY-MM-DD safely in local timezone without UTC drift
        function parseLocalDate(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        // Format Date object back to YYYY-MM-DD
        function formatLocalDate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // Get Monday of the week containing dateStr (Monday-to-Sunday renewal window)
        function getMondayOfWeekStr(dateStr) {
            const d = parseLocalDate(dateStr);
            const day = d.getDay(); // 0 = Sun, 1 = Mon ... 6 = Sat
            const diffToMonday = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diffToMonday);
            return formatLocalDate(d);
        }

        // Get past N week Monday keys for historical trend comparison
        function getPastWeekKeys(dateStr, count = 3) {
            const keys = [];
            let currentMonday = parseLocalDate(getMondayOfWeekStr(dateStr));
            for (let i = 0; i < count; i++) {
                currentMonday.setDate(currentMonday.getDate() - 7);
                keys.push(`WK-${formatLocalDate(currentMonday)}`);
            }
            return keys;
        }

        // Get past N month keys for historical trend comparison
        function getPastMonthKeys(dateStr, count = 3) {
            const keys = [];
            let d = parseLocalDate(dateStr);
            for (let i = 0; i < count; i++) {
                d.setMonth(d.getMonth() - 1);
                keys.push(`MO-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
            }
            return keys;
        }

        // Preset Life Goal & Routine Templates for quick setup
        const TASK_PRESET_TEMPLATES = [
            {
                id: 'morning_routine',
                name: '🌅 High-Performance Morning Routine',
                description: 'Hydration, mobility, and top-3 daily priority planning',
                tasks: [
                    { name: 'Drink 16oz water & sunlight exposure (10 min)', freqType: 'daily', comments: 'First thing upon waking' },
                    { name: 'Morning mobility & core activation', freqType: 'daily', comments: '15-minute routine' },
                    { name: 'Review top 3 daily priorities', freqType: 'weekdays', comments: 'Before checking email or messages' }
                ]
            },
            {
                id: 'weekly_admin_reset',
                name: '🗂️ Sunday Weekly Reset & Review',
                description: 'Calendar audit, inbox zero, and meal/schedule prep',
                tasks: [
                    { name: 'Clear email inbox & review upcoming week calendar', freqType: 'custom-weekly', customDays: [0], comments: 'Sunday evening reset' },
                    { name: 'Plan weekly meals & grocery list', freqType: 'weekly', comments: 'Keep nutrition on track' }
                ]
            },
            {
                id: 'fitness_block',
                name: '🏃 Endurance & Strength Block',
                description: 'Balanced cardio and resistance training cadence',
                tasks: [
                    { name: 'Strength training session (45 min)', freqType: 'custom-weekly', customDays: [1, 3, 5], comments: 'Mon/Wed/Fri split' },
                    { name: 'Zone 2 cardio / run (30-45 min)', freqType: 'custom-weekly', customDays: [2, 4, 6], comments: 'Keep heart rate steady' }
                ]
            }
        ];

        function App() {
            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('goal_tracker_data_v8');
                if (!saved) return initialCategories;
                try {
                    const parsed = JSON.parse(saved);
                    const darkColorMap = {
                        family: 'bg-emerald-950/70 text-emerald-300 border-emerald-800/80',
                        church: 'bg-indigo-950/70 text-indigo-300 border-indigo-800/80',
                        consulting: 'bg-amber-950/70 text-amber-300 border-amber-800/80',
                        self_imp: 'bg-sky-950/70 text-sky-300 border-sky-800/80'
                    };
                    return parsed.map(cat => ({
                        ...cat,
                        color: darkColorMap[cat.id] || (cat.color && cat.color.includes('950') ? cat.color : 'bg-slate-800 text-slate-200 border-slate-700'),
                        subcomponents: (cat.subcomponents || []).map(sub => ({
                            ...sub,
                            tasks: (sub.tasks || []).map(t => {
                                // Automatically upgrade default 10-mile / 10-hour tasks if saved from earlier versions
                                if (t.id === 'con2' && t.targetValue === undefined) {
                                    return { ...t, targetValue: 10, targetUnit: 'hrs', progress: t.progress || {} };
                                }
                                if (t.id === 's3' && t.targetValue === undefined) {
                                    return { ...t, targetValue: 10, targetUnit: 'mi', progress: t.progress || {} };
                                }
                                return { ...t, progress: t.progress || {} };
                            })
                        }))
                    }));
                } catch (e) {
                    return initialCategories;
                }
            });

            // Filter views: 'all' (everything), 'daily', 'weekly', 'monthly'
            const [view, setView] = useState('all');
            const [showArchived, setShowArchived] = useState(false);
            const [currentDate, setCurrentDate] = useState(() => formatLocalDate(new Date()));

            // Modal states
            const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
            const [isTemplateModalOpen, setIsTemplateModalOpen] = useState(false);
            const [isReportModalOpen, setIsReportModalOpen] = useState(false);
            const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
            const [dismissedReviewBanner, setDismissedReviewBanner] = useState(false);

            // Template Modal selection state
            const [selectedTemplateId, setSelectedTemplateId] = useState(TASK_PRESET_TEMPLATES[0].id);
            const [templateTargetCat, setTemplateTargetCat] = useState(initialCategories[0].id);
            const [templateTargetSub, setTemplateTargetSub] = useState(initialCategories[0].subcomponents[0].id);

            // Task Detail / Edit Modal state (Due Date, Comments, Recurrence, Numeric Target, & Archive)
            const [editingTaskCtx, setEditingTaskCtx] = useState(null);
            const [editTaskName, setEditTaskName] = useState('');
            const [editTaskFreqType, setEditTaskFreqType] = useState('daily');
            const [editTaskDays, setEditTaskDays] = useState([1, 3, 5]);
            const [editTaskMultiWeeks, setEditTaskMultiWeeks] = useState([2, 4]);
            const [editTaskMultiDays, setEditTaskMultiDays] = useState([2]);
            const [editTaskDueDate, setEditTaskDueDate] = useState('');
            const [editTaskComments, setEditTaskComments] = useState('');
            const [editTaskArchived, setEditTaskArchived] = useState(false);
            const [editTaskTargetValue, setEditTaskTargetValue] = useState('');
            const [editTaskTargetUnit, setEditTaskTargetUnit] = useState('');

            // Custom Confirmation & Notification UI
            const [confirmDialog, setConfirmDialog] = useState(null);
            const [toastMessage, setToastMessage] = useState('');

            // Add Task granular state
            const [selectedCategory, setSelectedCategory] = useState(initialCategories[0].id);
            const [selectedSubcomp, setSelectedSubcomp] = useState(initialCategories[0].subcomponents[0].id);
            const [newTaskName, setNewTaskName] = useState('');
            const [newTaskFreqType, setNewTaskFreqType] = useState('daily');
            const [newTaskDays, setNewTaskDays] = useState([1, 3, 5]);
            const [newTaskMultiWeeks, setNewTaskMultiWeeks] = useState([2, 4]);
            const [newTaskMultiDays, setNewTaskMultiDays] = useState([2]);
            const [newTaskDueDate, setNewTaskDueDate] = useState(() => formatLocalDate(new Date()));
            const [newTaskComments, setNewTaskComments] = useState('');
            const [newTaskTargetValue, setNewTaskTargetValue] = useState('');
            const [newTaskTargetUnit, setNewTaskTargetUnit] = useState('');

            // Report fields
            const [reportTimeframe, setReportTimeframe] = useState('weekly');
            const [reportCategoryScope, setReportCategoryScope] = useState('all');
            const [isMasterReport, setIsMasterReport] = useState(false);
            const [userReportNotes, setUserReportNotes] = useState('');

            // Firebase Cloud Sync Configuration State
            const [firebaseConfigInput, setFirebaseConfigInput] = useState(() => {
                return localStorage.getItem('goal_tracker_fb_config') || '';
            });
            const [isCloudSyncActive, setIsCloudSyncActive] = useState(() => {
                return localStorage.getItem('goal_tracker_cloud_active') === 'true';
            });
            const [syncStatus, setSyncStatus] = useState('Disconnected');

            const dbRef = useRef(null);
            const unsubscribeRef = useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3200);
            };

            useEffect(() => {
                localStorage.setItem('goal_tracker_data_v8', JSON.stringify(categories));
            }, [categories]);

            useEffect(() => {
                if (!isCloudSyncActive || !firebaseConfigInput.trim()) {
                    setSyncStatus('Local Mode');
                    if (unsubscribeRef.current) {
                        unsubscribeRef.current();
                        unsubscribeRef.current = null;
                    }
                    return;
                }

                try {
                    let cleanInput = firebaseConfigInput.trim();
                    if (cleanInput.startsWith('{')) {
                        cleanInput = `return (${cleanInput});`;
                    }
                    const config = new Function(cleanInput)();

                    if (!firebase.apps.length) {
                        firebase.initializeApp(config);
                    } else {
                        firebase.app();
                    }

                    dbRef.current = firebase.firestore();
                    setSyncStatus('Connecting...');

                    const docRef = dbRef.current.collection('goal_trackers').doc('main_user_data');

                    unsubscribeRef.current = docRef.onSnapshot((doc) => {
                        if (doc.exists) {
                            const cloudData = doc.data();
                            if (cloudData && cloudData.categories) {
                                setCategories(cloudData.categories);
                                setSyncStatus('🟢 Live Synced');
                            }
                        } else {
                            docRef.set({ categories });
                            setSyncStatus('🟢 Live Synced');
                        }
                    }, (error) => {
                        console.error("Firebase sync error:", error);
                        setSyncStatus('🔴 Sync Error');
                    });

                } catch (err) {
                    console.error("Config parse error:", err);
                    setSyncStatus('⚠️ Invalid Config');
                }

                return () => {
                    if (unsubscribeRef.current) unsubscribeRef.current();
                };
            }, [isCloudSyncActive, firebaseConfigInput]);

            const updateCategoriesAndCloud = (newCategoriesOrUpdater) => {
                setCategories(prev => {
                    const nextVal = typeof newCategoriesOrUpdater === 'function' ? newCategoriesOrUpdater(prev) : newCategoriesOrUpdater;
                    if (isCloudSyncActive && dbRef.current) {
                        dbRef.current.collection('goal_trackers').doc('main_user_data')
                            .set({ categories: nextVal })
                            .catch(err => console.error("Cloud write error:", err));
                    }
                    return nextVal;
                });
            };

            const handlePrevDate = () => {
                const d = parseLocalDate(currentDate);
                if (view === 'weekly') d.setDate(d.getDate() - 7);
                else if (view === 'monthly') d.setMonth(d.getMonth() - 1);
                else d.setDate(d.getDate() - 1);
                setCurrentDate(formatLocalDate(d));
            };

            const handleNextDate = () => {
                const d = parseLocalDate(currentDate);
                if (view === 'weekly') d.setDate(d.getDate() + 7);
                else if (view === 'monthly') d.setMonth(d.getMonth() + 1);
                else d.setDate(d.getDate() + 1);
                setCurrentDate(formatLocalDate(d));
            };

            const handleToday = () => {
                setCurrentDate(formatLocalDate(new Date()));
            };

            // Determine task's cadence bucket: 'daily' | 'weekly' | 'monthly' | 'other'
            const getTaskCadenceBucket = (task) => {
                const type = task.freqType || task.frequency;
                if (type === 'daily' || type === 'weekdays' || type === 'weekends' || type === 'one-off') return 'daily';
                if (type === 'weekly' || type === 'custom-weekly' || type === 'current-week') return 'weekly';
                if (type === 'monthly' || type === 'nth-weekday') return 'monthly';
                return 'other';
            };

            // Calculate consecutive daily streak up to currentDate for daily habits
            const getDailyStreak = (task, dateStr = currentDate) => {
                const type = task.freqType || task.frequency;
                if (type !== 'daily' && type !== 'weekdays' && type !== 'weekends') return 0;
                if (!task.completed) return 0;

                let streak = 0;
                let checkDate = parseLocalDate(dateStr);

                // If today isn't checked yet, start counting backward from yesterday
                if (!task.completed[formatLocalDate(checkDate)]) {
                    checkDate.setDate(checkDate.getDate() - 1);
                }

                for (let i = 0; i < 365; i++) {
                    const str = formatLocalDate(checkDate);
                    const dow = checkDate.getDay();
                    const isScheduledDay =
                        type === 'daily' ||
                        (type === 'weekdays' && dow >= 1 && dow <= 5) ||
                        (type === 'weekends' && (dow === 0 || dow === 6));

                    if (!isScheduledDay) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        continue;
                    }

                    if (task.completed[str]) {
                        streak++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else {
                        break;
                    }
                }
                return streak;
            };

            // Completion key per task type:
            // - Weekly tasks renew Monday morning (keyed by Monday YYYY-MM-DD)
            // - Monthly tasks renew 1st of month (keyed by YYYY-MM)
            // - One-off / current-week tasks use single persistent key or target Monday
            const getTaskCompletionKey = (task, dateStr = currentDate) => {
                const type = task.freqType || task.frequency;
                if (type === 'one-off') {
                    return 'ONE_OFF_DONE';
                }
                if (type === 'current-week') {
                    return task.targetMonday ? `WK-${task.targetMonday}` : `WK-${getMondayOfWeekStr(dateStr)}`;
                }
                if (type === 'weekly' || type === 'custom-weekly') {
                    return `WK-${getMondayOfWeekStr(dateStr)}`;
                }
                if (type === 'monthly' || type === 'nth-weekday') {
                    const d = parseLocalDate(dateStr);
                    return `MO-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                }
                if (type === 'quarterly') {
                    const d = parseLocalDate(dateStr);
                    const q = Math.floor(d.getMonth() / 3) + 1;
                    return `Q-${d.getFullYear()}-Q${q}`;
                }
                if (type === 'yearly') {
                    const d = parseLocalDate(dateStr);
                    return `YR-${d.getFullYear()}`;
                }
                return dateStr;
            };

            const isTaskCompletedOnDate = (task, dateStr = currentDate) => {
                const key = getTaskCompletionKey(task, dateStr);
                if (task.targetValue && Number(task.targetValue) > 0) {
                    const currentVal = Number((task.progress && task.progress[key]) || 0);
                    return currentVal >= Number(task.targetValue);
                }
                if (!task.completed) return false;
                if (task.completed[key]) return true;
                // Legacy fallback for older saved keys
                if (task.completed[dateStr]) return true;
                return false;
            };

            // Get current numeric logged progress for a numeric-target task
            const getTaskNumericProgress = (task, dateStr = currentDate) => {
                const refDate = task.freqType === 'current-week' && task.targetMonday ? task.targetMonday : dateStr;
                const key = getTaskCompletionKey(task, refDate);
                return Number((task.progress && task.progress[key]) || 0);
            };

            // Check if a task is overdue relative to currentDate
            const isTaskOverdue = (task, dateStr = currentDate) => {
                if (task.archived) return false;
                const type = task.freqType || task.frequency;
                if (type === 'current-week' && task.targetMonday) {
                    if (isTaskCompletedOnDate(task, task.targetMonday)) return false;
                    const endOfWeek = parseLocalDate(task.targetMonday);
                    endOfWeek.setDate(endOfWeek.getDate() + 6); // Sunday of target week
                    return formatLocalDate(endOfWeek) < dateStr;
                }
                if (!task.dueDate) return false;
                if (isTaskCompletedOnDate(task, dateStr) || isTaskCompletedOnDate(task, task.dueDate)) {
                    return false;
                }
                return task.dueDate < dateStr;
            };

            // Check if dateStr matches any selected Nth week & day-of-week combination
            const matchesNthWeeksAndDays = (dateStr, targetWeeks, targetDays) => {
                const d = parseLocalDate(dateStr);
                const dow = d.getDay();
                if (!targetDays.includes(dow)) return false;
                let occurrenceCount = 0;
                const temp = new Date(d.getFullYear(), d.getMonth(), 1);
                while (temp <= d) {
                    if (temp.getDay() === dow) occurrenceCount++;
                    temp.setDate(temp.getDate() + 1);
                }
                return targetWeeks.includes(occurrenceCount);
            };

            const taskOccursOnDate = (task, dateStr) => {
                const d = parseLocalDate(dateStr);
                const dayOfWeek = d.getDay();
                const type = task.freqType || task.frequency;

                if (type === 'daily') return true;
                if (type === 'weekdays') return dayOfWeek >= 1 && dayOfWeek <= 5;
                if (type === 'weekends') return dayOfWeek === 0 || dayOfWeek === 6;
                if (type === 'custom-weekly') {
                    const days = task.customDays || [];
                    return days.includes(dayOfWeek);
                }
                if (type === 'nth-weekday') {
                    const weeks = Array.isArray(task.nthWeeks)
                        ? task.nthWeeks
                        : (task.nthWeek ? [Number(task.nthWeek)] : []);
                    const days = Array.isArray(task.nthDays)
                        ? task.nthDays
                        : (task.nthDay !== undefined ? [Number(task.nthDay)] : []);
                    return matchesNthWeeksAndDays(dateStr, weeks, days);
                }
                if (type === 'current-week') {
                    const mon = task.targetMonday || getMondayOfWeekStr(dateStr);
                    return getMondayOfWeekStr(dateStr) === mon || isTaskOverdue(task, dateStr);
                }
                if (type === 'one-off') {
                    return task.dueDate === dateStr || isTaskOverdue(task, dateStr);
                }
                return true;
            };

            // Filter tasks based on active view tab & archive toggle
            const isTaskVisibleForView = (task, activeView = view) => {
                if (showArchived) {
                    return !!task.archived;
                }
                if (task.archived) return false;

                const type = task.freqType || task.frequency;
                const overdue = isTaskOverdue(task, currentDate);
                const hasSpecificDueDate = !!task.dueDate;

                if (activeView === 'all') {
                    if (type === 'current-week') return taskOccursOnDate(task, currentDate);
                    if (type === 'one-off') return task.dueDate === currentDate || overdue;
                    return true;
                }

                const bucket = getTaskCadenceBucket(task);
                if (activeView === 'daily') {
                    if (overdue) return true;
                    // Any task with a specific due date on currentDate appears on Daily Tasks for that exact day
                    if (hasSpecificDueDate && task.dueDate === currentDate) return true;
                    if (type === 'one-off') return task.dueDate === currentDate;
                    return bucket === 'daily' && taskOccursOnDate(task, currentDate);
                }
                if (activeView === 'weekly') {
                    // Never propagate specific due-date tasks into the weekly bucket unless explicitly weekly/current-week
                    if (type === 'one-off') return false;
                    if (type === 'current-week') return taskOccursOnDate(task, currentDate);
                    return bucket === 'weekly';
                }
                if (activeView === 'monthly') {
                    if (type === 'one-off') return false;
                    return bucket === 'monthly';
                }
                return true;
            };

            const toggleTask = (catId, subId, taskId) => {
                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== catId) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== subId) return sub;
                            return {
                                ...sub,
                                tasks: sub.tasks.map(task => {
                                    if (task.id !== taskId) return task;
                                    const refDate = task.freqType === 'current-week' && task.targetMonday ? task.targetMonday : currentDate;
                                    const key = getTaskCompletionKey(task, refDate);
                                    const currentStatus = isTaskCompletedOnDate(task, refDate);

                                    // If numeric goal, toggling checkbox jumps to targetValue or resets to 0
                                    if (task.targetValue && Number(task.targetValue) > 0) {
                                        const nextVal = currentStatus ? 0 : Number(task.targetValue);
                                        return {
                                            ...task,
                                            progress: { ...(task.progress || {}), [key]: nextVal },
                                            completed: { ...task.completed, [key]: !currentStatus }
                                        };
                                    }

                                    const updatedCompleted = { ...task.completed, [key]: !currentStatus };
                                    if (currentStatus && task.completed[refDate]) {
                                        delete updatedCompleted[refDate];
                                    }
                                    return {
                                        ...task,
                                        completed: updatedCompleted
                                    };
                                })
                            };
                        })
                    };
                }));
            };

            // Update numeric progress directly (supports decimals & values > targetValue)
            const updateTaskNumericValue = (catId, subId, taskId, rawValue) => {
                const parsedNum = rawValue === '' ? 0 : Math.max(0, parseFloat(rawValue) || 0);
                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== catId) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== subId) return sub;
                            return {
                                ...sub,
                                tasks: sub.tasks.map(task => {
                                    if (task.id !== taskId) return task;
                                    const refDate = task.freqType === 'current-week' && task.targetMonday ? task.targetMonday : currentDate;
                                    const key = getTaskCompletionKey(task, refDate);
                                    const target = Number(task.targetValue || 0);
                                    const isMet = target > 0 && parsedNum >= target;
                                    return {
                                        ...task,
                                        progress: { ...(task.progress || {}), [key]: parsedNum },
                                        completed: { ...task.completed, [key]: isMet }
                                    };
                                })
                            };
                        })
                    };
                }));
            };

            const openTaskDetailModal = (catId, subId, task) => {
                setEditingTaskCtx({ catId, subId, taskId: task.id });
                setEditTaskName(task.name || '');
                setEditTaskFreqType(task.freqType || task.frequency || 'daily');
                setEditTaskDays(Array.isArray(task.customDays) ? task.customDays : [1, 3, 5]);
                setEditTaskMultiWeeks(
                    Array.isArray(task.nthWeeks)
                        ? task.nthWeeks
                        : (task.nthWeek ? [Number(task.nthWeek)] : [2, 4])
                );
                setEditTaskMultiDays(
                    Array.isArray(task.nthDays)
                        ? task.nthDays
                        : (task.nthDay !== undefined ? [Number(task.nthDay)] : [2])
                );
                setEditTaskDueDate(task.dueDate || '');
                setEditTaskComments(task.comments || '');
                setEditTaskArchived(!!task.archived);
                setEditTaskTargetValue(task.targetValue ? String(task.targetValue) : '');
                setEditTaskTargetUnit(task.targetUnit || '');
            };

            const handleSaveTaskDetails = (e) => {
                e.preventDefault();
                if (!editingTaskCtx || !editTaskName.trim()) return;

                if (editTaskFreqType === 'custom-weekly' && editTaskDays.length === 0) {
                    showToast('Please select at least one day of the week.');
                    return;
                }
                if (editTaskFreqType === 'nth-weekday' && (editTaskMultiWeeks.length === 0 || editTaskMultiDays.length === 0)) {
                    showToast('Please select at least one week and one day of the month.');
                    return;
                }

                const parsedTarget = editTaskTargetValue !== '' && Number(editTaskTargetValue) > 0
                    ? Number(editTaskTargetValue)
                    : null;

                const { catId, subId, taskId } = editingTaskCtx;
                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== catId) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== subId) return sub;
                            return {
                                ...sub,
                                tasks: sub.tasks.map(task => {
                                    if (task.id !== taskId) return task;
                                    return {
                                        ...task,
                                        name: editTaskName.trim(),
                                        freqType: editTaskFreqType,
                                        customDays: [...editTaskDays].sort((a, b) => a - b),
                                        nthWeeks: [...editTaskMultiWeeks].sort((a, b) => a - b),
                                        nthDays: [...editTaskMultiDays].sort((a, b) => a - b),
                                        targetMonday: editTaskFreqType === 'current-week'
                                            ? (task.targetMonday || getMondayOfWeekStr(currentDate))
                                            : null,
                                        dueDate: editTaskDueDate || null,
                                        comments: editTaskComments,
                                        archived: editTaskArchived,
                                        targetValue: parsedTarget,
                                        targetUnit: parsedTarget ? (editTaskTargetUnit.trim() || '') : ''
                                    };
                                })
                            };
                        })
                    };
                }));
                setEditingTaskCtx(null);
                showToast(editTaskArchived ? 'Task archived (history preserved).' : 'Task updated!');
            };

            const requestDeleteTask = (catId, subId, task) => {
                setConfirmDialog({
                    title: 'Delete Task Permanently',
                    message: `Are you sure you want to permanently delete "${task.name}" and its completion history? (Tip: Click the task to Archive it instead if you want to keep its history.)`,
                    onConfirm: () => {
                        updateCategoriesAndCloud(prev => prev.map(cat => {
                            if (cat.id !== catId) return cat;
                            return {
                                ...cat,
                                subcomponents: cat.subcomponents.map(sub => {
                                    if (sub.id !== subId) return sub;
                                    return {
                                        ...sub,
                                        tasks: sub.tasks.filter(t => t.id !== task.id)
                                    };
                                })
                            };
                        }));
                        setConfirmDialog(null);
                        showToast('Task deleted.');
                    }
                });
            };

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!newTaskName.trim()) return;

                if (newTaskFreqType === 'custom-weekly' && newTaskDays.length === 0) {
                    showToast('Please select at least one day of the week.');
                    return;
                }
                if (newTaskFreqType === 'nth-weekday' && (newTaskMultiWeeks.length === 0 || newTaskMultiDays.length === 0)) {
                    showToast('Please select at least one week and one day of the month.');
                    return;
                }

                const parsedTarget = newTaskTargetValue !== '' && Number(newTaskTargetValue) > 0
                    ? Number(newTaskTargetValue)
                    : null;

                const newTask = {
                    id: 'task_' + Date.now(),
                    name: newTaskName.trim(),
                    freqType: newTaskFreqType,
                    customDays: [...newTaskDays].sort((a, b) => a - b),
                    nthWeeks: [...newTaskMultiWeeks].sort((a, b) => a - b),
                    nthDays: [...newTaskMultiDays].sort((a, b) => a - b),
                    targetMonday: newTaskFreqType === 'current-week' ? getMondayOfWeekStr(currentDate) : null,
                    dueDate: newTaskFreqType === 'one-off' ? newTaskDueDate : null,
                    comments: newTaskComments.trim(),
                    archived: false,
                    targetValue: parsedTarget,
                    targetUnit: parsedTarget ? (newTaskTargetUnit.trim() || '') : '',
                    progress: {},
                    completed: {}
                };

                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== selectedCategory) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== selectedSubcomp) return sub;
                            return {
                                ...sub,
                                tasks: [...sub.tasks, newTask]
                            };
                        })
                    };
                }));

                setNewTaskName('');
                setNewTaskComments('');
                setNewTaskTargetValue('');
                setNewTaskTargetUnit('');
                setIsTaskModalOpen(false);
                showToast('Task added!');
            };

            const handleApplyTemplate = (e) => {
                e.preventDefault();
                const template = TASK_PRESET_TEMPLATES.find(t => t.id === selectedTemplateId);
                if (!template) return;

                const createdTasks = template.tasks.map((t, idx) => ({
                    id: `task_${Date.now()}_${idx}`,
                    name: t.name,
                    freqType: t.freqType,
                    customDays: t.customDays || [1, 3, 5],
                    nthWeeks: [2, 4],
                    nthDays: [2],
                    targetMonday: t.freqType === 'current-week' ? getMondayOfWeekStr(currentDate) : null,
                    dueDate: null,
                    comments: t.comments || '',
                    archived: false,
                    progress: {},
                    completed: {}
                }));

                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== templateTargetCat) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== templateTargetSub) return sub;
                            return {
                                ...sub,
                                tasks: [...sub.tasks, ...createdTasks]
                            };
                        })
                    };
                }));

                setIsTemplateModalOpen(false);
                showToast(`Applied "${template.name}" (${createdTasks.length} tasks added)!`);
            };

            const exportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(categories, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `goal_tracker_backup_${formatLocalDate(new Date())}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast('Backup exported!');
            };

            const importBackup = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            updateCategoriesAndCloud(parsed);
                            showToast("Data successfully restored and synced!");
                            setIsSyncModalOpen(false);
                        } catch (err) {
                            showToast("Invalid backup file format.");
                        }
                    };
                }
            };

            const getFreqLabel = (task) => {
                const type = task.freqType || task.frequency;
                if (type === 'daily') return 'Daily';
                if (type === 'weekdays') return 'Mon-Fri';
                if (type === 'weekends') return 'Weekends';
                if (type === 'weekly') return 'Weekly';
                if (type === 'current-week') return `Due Wk of ${task.targetMonday || getMondayOfWeekStr(currentDate)}`;
                if (type === 'monthly') return 'Monthly';
                if (type === 'custom-weekly') {
                    const map = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    return (task.customDays || []).map(d => map[d]).join(', ');
                }
                if (type === 'nth-weekday') {
                    const weekLabels = ['1st', '2nd', '3rd', '4th', '5th'];
                    const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    const weeks = Array.isArray(task.nthWeeks)
                        ? task.nthWeeks
                        : (task.nthWeek ? [Number(task.nthWeek)] : []);
                    const days = Array.isArray(task.nthDays)
                        ? task.nthDays
                        : (task.nthDay !== undefined ? [Number(task.nthDay)] : []);
                    const wStr = weeks.map(w => weekLabels[w - 1]).filter(Boolean).join(' & ');
                    const dStr = days.map(d => dayLabels[d]).filter(Boolean).join('/');
                    return `${wStr} ${dStr}`.trim();
                }
                if (type === 'one-off') return `Due: ${task.dueDate}`;
                return type;
            };

            // Compute top-level progress bar scoped to the active view filter
            let totalTasks = 0;
            let completedTasks = 0;

            categories.forEach(cat => {
                cat.subcomponents.forEach(sub => {
                    sub.tasks.forEach(task => {
                        if (isTaskVisibleForView(task, view)) {
                            totalTasks++;
                            const refDate = task.freqType === 'current-week' && task.targetMonday ? task.targetMonday : currentDate;
                            if (isTaskCompletedOnDate(task, refDate)) completedTasks++;
                        }
                    });
                });
            });

            const percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            // Generate in-depth report data with sub-component stats, historical trend comparison, & completed/incomplete lists
            const generateReportData = () => {
                let scopedCats = categories;
                if (!isMasterReport && reportCategoryScope !== 'all') {
                    scopedCats = categories.filter(c => c.id === reportCategoryScope);
                }

                const effectiveFilter = isMasterReport ? 'all' : view;

                let total = 0;
                let completed = 0;
                const catBreakdown = [];
                const subcompBreakdown = [];
                const completedList = [];
                const incompleteList = [];
                const allActiveScopedTasks = [];

                scopedCats.forEach(cat => {
                    let catTotal = 0;
                    let catDone = 0;
                    cat.subcomponents.forEach(sub => {
                        let subTotal = 0;
                        let subDone = 0;
                        sub.tasks.forEach(task => {
                            if (task.archived) return;
                            if (!isTaskVisibleForView(task, effectiveFilter)) return;
                            allActiveScopedTasks.push(task);

                            catTotal++;
                            subTotal++;
                            total++;
                            const refDate = task.freqType === 'current-week' && task.targetMonday ? task.targetMonday : currentDate;
                            const done = isTaskCompletedOnDate(task, refDate);
                            const hasNumeric = task.targetValue && Number(task.targetValue) > 0;
                            const loggedNum = hasNumeric ? getTaskNumericProgress(task, refDate) : null;
                            const numericSummary = hasNumeric
                                ? ` (${loggedNum} / ${task.targetValue}${task.targetUnit ? ' ' + task.targetUnit : ''})`
                                : '';
                            const taskSummary = {
                                id: task.id,
                                name: `${task.name}${numericSummary}`,
                                categoryName: cat.name,
                                subName: sub.name,
                                freqLabel: getFreqLabel(task),
                                dueDate: task.dueDate,
                                comments: task.comments,
                                overdue: isTaskOverdue(task, currentDate)
                            };
                            if (done) {
                                catDone++;
                                subDone++;
                                completed++;
                                completedList.push(taskSummary);
                            } else {
                                incompleteList.push(taskSummary);
                            }
                        });
                        if (subTotal > 0) {
                            subcompBreakdown.push({
                                categoryName: cat.name,
                                name: sub.name,
                                total: subTotal,
                                done: subDone,
                                rate: Math.round((subDone / subTotal) * 100)
                            });
                        }
                    });
                    catBreakdown.push({
                        name: cat.name,
                        total: catTotal,
                        done: catDone,
                        rate: catTotal > 0 ? Math.round((catDone / catTotal) * 100) : 0
                    });
                });

                const overallRate = total > 0 ? Math.round((completed / total) * 100) : 0;

                // Historical Period Trend Comparison (comparing past 3 weeks or 3 months)
                const pastKeys = reportTimeframe === 'monthly'
                    ? getPastMonthKeys(currentDate, 3)
                    : getPastWeekKeys(currentDate, 3);

                const historicalStats = pastKeys.map(pKey => {
                    let hDone = 0;
                    let hTotal = 0;
                    allActiveScopedTasks.forEach(t => {
                        const type = t.freqType || t.frequency;
                        if (reportTimeframe === 'monthly' && (type === 'monthly' || type === 'nth-weekday')) {
                            hTotal++;
                            if (t.completed && t.completed[pKey]) hDone++;
                        } else if (reportTimeframe !== 'monthly' && (type === 'weekly' || type === 'custom-weekly')) {
                            hTotal++;
                            if (t.completed && t.completed[pKey]) hDone++;
                        }
                    });
                    return {
                        periodKey: pKey,
                        done: hDone,
                        total: hTotal,
                        rate: hTotal > 0 ? Math.round((hDone / hTotal) * 100) : 0
                    };
                });

                const prevPeriod = historicalStats[0];
                const trendDelta = prevPeriod && prevPeriod.total > 0 ? overallRate - prevPeriod.rate : null;
                let trendComparisonMsg = 'No prior period baseline recorded yet.';
                if (trendDelta !== null) {
                    if (trendDelta > 0) trendComparisonMsg = `📈 Up +${trendDelta}% vs. previous period (${prevPeriod.rate}%).`;
                    else if (trendDelta < 0) trendComparisonMsg = `📉 Down ${trendDelta}% vs. previous period (${prevPeriod.rate}%).`;
                    else trendComparisonMsg = `➡️ Holding steady at ${overallRate}% compared to last period.`;
                }

                // Identify strongest & bottleneck subcomponents
                const sortedSubcomps = [...subcompBreakdown].sort((a, b) => b.rate - a.rate);
                const topSubcomp = sortedSubcomps[0] || null;
                const bottleneckSubcomp = sortedSubcomps.length > 1 ? sortedSubcomps[sortedSubcomps.length - 1] : null;

                let feedback = overallRate >= 80
                    ? "🟢 Excellent execution. High consistency maintained across your tracked routines."
                    : overallRate >= 50
                        ? "🟡 Moderate momentum. Review incomplete items and protect time blocks for recurring routines."
                        : "🔴 Low completion rate. Consider archiving low-priority tasks or breaking large goals into smaller steps.";

                return {
                    total,
                    completed,
                    overallRate,
                    catBreakdown,
                    subcompBreakdown,
                    historicalStats,
                    trendComparisonMsg,
                    topSubcomp,
                    bottleneckSubcomp,
                    completedList,
                    incompleteList,
                    feedback
                };
            };

            const reportData = generateReportData();

            const viewLabels = {
                all: 'All Tasks',
                daily: 'Daily Tasks',
                weekly: 'Weekly Tasks',
                monthly: 'Monthly Tasks'
            };

            const toggleNumberInArray = (arr, setArr, val) => {
                if (arr.includes(val)) {
                    setArr(arr.filter(x => x !== val));
                } else {
                    setArr([...arr, val]);
                }
            };

            // Check if currentDate is Sunday or the last day of the calendar month for Review Prompt
            const parsedCurr = parseLocalDate(currentDate);
            const isSunday = parsedCurr.getDay() === 0;
            const tomorrow = new Date(parsedCurr);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const isLastDayOfMonth = tomorrow.getDate() === 1;
            const showEndOfPeriodPrompt = !dismissedReviewBanner && (isSunday || isLastDayOfMonth);

            return (
                <div className="max-w-5xl mx-auto p-4 sm:p-6">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-800 border border-slate-700 text-slate-100 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium">
                            {toastMessage}
                        </div>
                    )}

                    {/* End-of-Week / End-of-Month Review Prompt Banner */}
                    {showEndOfPeriodPrompt && (
                        <div className="bg-gradient-to-r from-indigo-950/90 via-slate-900 to-emerald-950/80 border border-indigo-700/70 rounded-2xl p-4 mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">
                            <div className="flex items-start gap-3">
                                <span className="text-xl">🗓️</span>
                                <div>
                                    <div className="text-sm font-bold text-white">
                                        {isLastDayOfMonth ? 'End-of-Month Review & Reset Tonight!' : 'Sunday Weekly Reset & Review Tonight!'}
                                    </div>
                                    <div className="text-xs text-slate-300">
                                        {isLastDayOfMonth
                                            ? 'Monthly tasks reset tomorrow on the 1st. Take a moment to review trends, log reflections, and export a JSON backup.'
                                            : 'Weekly tasks reset Monday morning. Wrap up remaining items, review your weekly trends, and back up your progress.'}
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0 self-end sm:self-center">
                                <button
                                    onClick={() => setIsReportModalOpen(true)}
                                    className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition"
                                >
                                    Open Review Report
                                </button>
                                <button
                                    onClick={exportBackup}
                                    className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
                                >
                                    📥 Backup
                                </button>
                                <button
                                    onClick={() => setDismissedReviewBanner(true)}
                                    title="Dismiss prompt"
                                    className="text-slate-400 hover:text-slate-200 px-1.5 text-sm font-bold"
                                >
                                    ✕
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-slate-900 rounded-2xl shadow-lg border border-slate-800 p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <div className="flex items-center gap-3">
                                <h1 className="text-2xl font-bold text-white">Goal & Task Tracker</h1>
                                <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${syncStatus.includes('Synced') ? 'bg-emerald-950/80 text-emerald-300 border-emerald-800' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>
                                    {syncStatus}
                                </span>
                            </div>
                            <p className="text-sm text-slate-400">Live multi-device sync, numeric targets, habit streaks, and trend analytics.</p>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap">
                            <div className="flex items-center bg-slate-800 rounded-xl p-1 border border-slate-700">
                                <button onClick={handlePrevDate} title="Previous" className="p-1.5 hover:bg-slate-700 rounded-lg text-slate-300 transition font-bold text-xs">◀</button>
                                <button onClick={handleToday} className="px-2 text-xs font-semibold text-slate-200 hover:text-blue-400">Today</button>
                                <button onClick={handleNextDate} title="Next" className="p-1.5 hover:bg-slate-700 rounded-lg text-slate-300 transition font-bold text-xs">▶</button>
                            </div>
                            <input 
                                type="date" 
                                value={currentDate} 
                                onChange={e => setCurrentDate(e.target.value)}
                                className="px-3 py-2 border rounded-xl text-sm font-medium bg-slate-800 text-slate-100 border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 [color-scheme:dark]"
                            />
                            <button onClick={() => setIsReportModalOpen(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-3 py-2 rounded-xl text-sm transition shadow-sm">
                                📊 Reports
                            </button>
                            <button onClick={() => setIsSyncModalOpen(true)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium px-3 py-2 rounded-xl text-sm transition shadow-sm">
                                ⚡ Cloud & Backup
                            </button>
                            <button onClick={() => setIsTemplateModalOpen(true)} className="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3 py-2 rounded-xl text-sm transition shadow-sm">
                                ✨ Templates
                            </button>
                            <button onClick={() => setIsTaskModalOpen(true)} className="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-xl text-sm transition shadow-sm">
                                + Add Task
                            </button>
                        </div>
                    </header>

                    {/* View Filter Switcher & Progress Bar */}
                    <div className="bg-slate-900 rounded-2xl shadow-lg border border-slate-800 p-6 mb-6">
                        <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                            <div className="flex flex-wrap items-center gap-2">
                                <div className="inline-flex flex-wrap rounded-xl bg-slate-800 p-1 border border-slate-700/80">
                                    <button onClick={() => { setShowArchived(false); setView('all'); }} className={`px-3.5 py-2 rounded-lg text-sm font-medium transition ${!showArchived && view === 'all' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>All Tasks</button>
                                    <button onClick={() => { setShowArchived(false); setView('daily'); }} className={`px-3.5 py-2 rounded-lg text-sm font-medium transition ${!showArchived && view === 'daily' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>Daily Tasks</button>
                                    <button onClick={() => { setShowArchived(false); setView('weekly'); }} className={`px-3.5 py-2 rounded-lg text-sm font-medium transition ${!showArchived && view === 'weekly' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>Weekly Tasks</button>
                                    <button onClick={() => { setShowArchived(false); setView('monthly'); }} className={`px-3.5 py-2 rounded-lg text-sm font-medium transition ${!showArchived && view === 'monthly' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>Monthly Tasks</button>
                                </div>
                                <button
                                    onClick={() => setShowArchived(!showArchived)}
                                    className={`px-3 py-2 rounded-xl text-xs font-semibold border transition ${showArchived ? 'bg-amber-950/80 text-amber-300 border-amber-700' : 'bg-slate-800/80 text-slate-400 border-slate-700 hover:text-slate-200'}`}
                                >
                                    {showArchived ? '📦 Viewing Archived' : '📦 View Archived'}
                                </button>
                            </div>
                            <div className="text-right">
                                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                                    {showArchived ? 'Archived Tasks' : `Completion Status (${viewLabels[view]})`}
                                </span>
                                <div className="text-lg font-bold text-white">{completedTasks} / {totalTasks} Tasks ({percent}%)</div>
                            </div>
                        </div>
                        <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                            <div className="bg-blue-500 h-3 rounded-full transition-all duration-500" style={{ width: `${percent}%` }}></div>
                        </div>
                    </div>

                    {/* Categories Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {categories.map(cat => {
                            const hasVisible = cat.subcomponents.some(sub => sub.tasks.some(t => isTaskVisibleForView(t, view)));
                            return (
                                <div key={cat.id} className="bg-slate-900 rounded-2xl shadow-lg border border-slate-800 p-6 flex flex-col justify-between">
                                    <div>
                                        <div className={`inline-block px-3 py-1 rounded-full text-xs font-semibold border mb-4 ${cat.color}`}>
                                            {cat.name}
                                        </div>
                                        <div className="space-y-4">
                                            {cat.subcomponents.map(sub => {
                                                const visibleSubTasks = sub.tasks.filter(t => isTaskVisibleForView(t, view));
                                                if (visibleSubTasks.length === 0) return null;
                                                return (
                                                    <div key={sub.id} className="border-b border-slate-800 pb-3 last:border-0 last:pb-0">
                                                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">{sub.name}</h4>
                                                        <ul className="space-y-2">
                                                            {visibleSubTasks.map(task => {
                                                                const refDate = task.freqType === 'current-week' && task.targetMonday ? task.targetMonday : currentDate;
                                                                const isChecked = isTaskCompletedOnDate(task, refDate);
                                                                const overdue = isTaskOverdue(task, currentDate);
                                                                const streak = getDailyStreak(task, currentDate);
                                                                const hasNumericTarget = task.targetValue && Number(task.targetValue) > 0;
                                                                const targetVal = hasNumericTarget ? Number(task.targetValue) : 0;
                                                                const currentLogged = hasNumericTarget ? getTaskNumericProgress(task, refDate) : 0;
                                                                const remainingVal = hasNumericTarget ? Math.max(0, +(targetVal - currentLogged).toFixed(2)) : 0;
                                                                const extraVal = hasNumericTarget && currentLogged > targetVal ? +(currentLogged - targetVal).toFixed(2) : 0;
                                                                const pctBar = hasNumericTarget ? Math.min(100, Math.round((currentLogged / targetVal) * 100)) : 0;

                                                                return (
                                                                    <li 
                                                                        key={task.id} 
                                                                        className={`flex flex-col gap-2 group p-2 rounded-xl transition ${
                                                                            overdue 
                                                                                ? 'bg-red-950/40 border border-red-800/80' 
                                                                                : 'hover:bg-slate-800/60 border border-transparent'
                                                                        }`}
                                                                    >
                                                                        <div className="flex items-center justify-between w-full">
                                                                            <div className="flex items-center gap-3 min-w-0 flex-1">
                                                                                <input 
                                                                                    type="checkbox" 
                                                                                    checked={isChecked}
                                                                                    onChange={() => toggleTask(cat.id, sub.id, task.id)}
                                                                                    className="w-4 h-4 text-blue-500 bg-slate-800 rounded border-slate-600 focus:ring-blue-500 shrink-0 cursor-pointer"
                                                                                />
                                                                                <button
                                                                                    type="button"
                                                                                    onClick={() => openTaskDetailModal(cat.id, sub.id, task)}
                                                                                    title="Click to edit task, numeric target, frequency, due date, comments, or archive"
                                                                                    className="text-left flex flex-wrap items-center gap-1.5 min-w-0 flex-1"
                                                                                >
                                                                                    <span className={`text-sm truncate ${isChecked ? 'line-through text-slate-500' : overdue ? 'text-red-300 font-semibold' : 'text-slate-200 font-medium hover:text-blue-400'}`}>
                                                                                        {task.name}
                                                                                    </span>
                                                                                    {streak >= 2 && (
                                                                                        <span title={`${streak}-day completion streak!`} className="text-[10px] font-bold bg-orange-950/90 text-orange-300 border border-orange-700/80 px-1.5 py-0.5 rounded-full">
                                                                                            🔥 {streak}d
                                                                                        </span>
                                                                                    )}
                                                                                    {overdue && (
                                                                                        <span className="text-[10px] font-bold bg-red-600 text-white px-1.5 py-0.5 rounded uppercase tracking-wider">
                                                                                            Overdue
                                                                                        </span>
                                                                                    )}
                                                                                    {task.archived && (
                                                                                        <span className="text-[10px] font-bold bg-amber-950 text-amber-300 border border-amber-800 px-1.5 py-0.5 rounded uppercase">
                                                                                            Archived
                                                                                        </span>
                                                                                    )}
                                                                                    {task.dueDate && !overdue && (
                                                                                        <span className="text-[10px] bg-amber-950/70 text-amber-300 border border-amber-800/80 px-1.5 py-0.5 rounded font-medium">
                                                                                            📅 {task.dueDate}
                                                                                        </span>
                                                                                    )}
                                                                                    {task.comments && task.comments.trim() !== '' && (
                                                                                        <span className="text-[10px] bg-sky-950/70 text-sky-300 border border-sky-800/80 px-1.5 py-0.5 rounded font-medium">
                                                                                            💬 Note
                                                                                        </span>
                                                                                    )}
                                                                                </button>
                                                                            </div>
                                                                            <div className="flex items-center gap-2 shrink-0 ml-2">
                                                                                <span className="text-[10px] bg-slate-800 text-slate-300 border border-slate-700 px-2 py-0.5 rounded-md font-medium">
                                                                                    {getFreqLabel(task)}
                                                                                </span>
                                                                                <button 
                                                                                    onClick={() => openTaskDetailModal(cat.id, sub.id, task)}
                                                                                    title="Edit / Archive task"
                                                                                    className="text-slate-500 hover:text-blue-400 transition text-xs px-1 font-bold"
                                                                                >
                                                                                    ✎
                                                                                </button>
                                                                                <button 
                                                                                    onClick={() => requestDeleteTask(cat.id, sub.id, task)}
                                                                                    title="Delete task"
                                                                                    className="text-slate-600 hover:text-red-400 transition text-xs px-1 font-bold"
                                                                                >
                                                                                    ✕
                                                                                </button>
                                                                            </div>
                                                                        </div>

                                                                        {/* Numeric Progress Input & Remaining / Exceeded Readout */}
                                                                        {hasNumericTarget && (
                                                                            <div className="pl-7 pr-1 flex flex-col gap-1.5">
                                                                                <div className="flex flex-wrap items-center justify-between gap-2 text-xs">
                                                                                    <div className="flex items-center gap-1.5">
                                                                                        <input
                                                                                            type="number"
                                                                                            step="any"
                                                                                            min="0"
                                                                                            value={currentLogged === 0 ? '' : currentLogged}
                                                                                            placeholder="0"
                                                                                            onChange={(e) => updateTaskNumericValue(cat.id, sub.id, task.id, e.target.value)}
                                                                                            aria-label={`Logged progress for ${task.name}`}
                                                                                            className="w-20 px-2 py-1 rounded-lg bg-slate-950 border border-slate-700 text-slate-100 text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-blue-500"
                                                                                        />
                                                                                        <span className="text-slate-400 font-medium">
                                                                                            / {targetVal} {task.targetUnit || ''}
                                                                                        </span>
                                                                                    </div>
                                                                                    <div className="text-[11px] font-semibold">
                                                                                        {extraVal > 0 ? (
                                                                                            <span className="text-emerald-400">
                                                                                                🎉 Goal met! (+{extraVal} {task.targetUnit || ''} bonus)
                                                                                            </span>
                                                                                        ) : remainingVal === 0 ? (
                                                                                            <span className="text-emerald-400">
                                                                                                ✅ Goal reached!
                                                                                            </span>
                                                                                        ) : (
                                                                                            <span className="text-slate-400">
                                                                                                {remainingVal} {task.targetUnit || ''} left
                                                                                            </span>
