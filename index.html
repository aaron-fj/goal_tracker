<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Category Goal & Task Tracker with Master Reports</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase App & Firestore Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-blue-500/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Default initial category and task structure with dark-mode styling
        const initialCategories = [
            {
                id: 'family',
                name: '1. Family / Home',
                color: 'bg-emerald-950/70 text-emerald-300 border-emerald-800/80',
                subcomponents: [
                    { id: 'maint', name: 'Maintenance', tasks: [] },
                    { 
                        id: 'fam_time', 
                        name: 'Family Time', 
                        tasks: [
                            { id: 't1', name: 'Teach kids something new', freqType: 'weekly', completed: {}, comments: '', archived: false },
                            { id: 't2', name: 'Date night', freqType: 'monthly', completed: {}, comments: '', archived: false }
                        ] 
                    },
                    { id: 'admin', name: 'Admin', tasks: [] }
                ]
            },
            {
                id: 'church',
                name: '2. Church Calling',
                color: 'bg-indigo-950/70 text-indigo-300 border-indigo-800/80',
                subcomponents: [
                    { 
                        id: 'ministering', 
                        name: 'Ministering', 
                        tasks: [
                            { id: 'c1', name: 'Minister to assigned families', freqType: 'monthly', completed: {}, comments: '', archived: false },
                            { id: 'c2', name: 'Empower ministering district', freqType: 'monthly', completed: {}, comments: '', archived: false }
                        ] 
                    },
                    { 
                        id: 'councils', 
                        name: 'Councils / Admin', 
                        tasks: [
                            { id: 'c6', name: 'Confirm with teacher', freqType: 'weekly', completed: {}, comments: '', archived: false },
                            { id: 'c7', name: 'Print Bulletin', freqType: 'weekly', completed: {}, comments: '', archived: false }
                        ] 
                    }
                ]
            },
            {
                id: 'consulting',
                name: '3. Consulting',
                color: 'bg-amber-950/70 text-amber-300 border-amber-800/80',
                subcomponents: [
                    { 
                        id: 'research', 
                        name: 'Research / Analysis', 
                        tasks: [
                            { id: 'con2', name: '10 hours / week logged', freqType: 'weekly', completed: {}, comments: '', archived: false }
                        ] 
                    }
                ]
            },
            {
                id: 'self_imp',
                name: '4. Self-Improvement',
                color: 'bg-sky-950/70 text-sky-300 border-sky-800/80',
                subcomponents: [
                    { 
                        id: 'physical', 
                        name: 'Physical', 
                        tasks: [
                            { id: 's2', name: 'Mobility / core training (15 min)', freqType: 'daily', completed: {}, comments: '', archived: false },
                            { id: 's3', name: '10 miles running', freqType: 'weekly', completed: {}, comments: '', archived: false }
                        ] 
                    }
                ]
            }
        ];

        // Parse YYYY-MM-DD safely in local timezone without UTC drift
        function parseLocalDate(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        // Format Date object back to YYYY-MM-DD
        function formatLocalDate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // Get Monday of the week containing dateStr (Monday-to-Sunday renewal window)
        function getMondayOfWeekStr(dateStr) {
            const d = parseLocalDate(dateStr);
            const day = d.getDay(); // 0 = Sun, 1 = Mon ... 6 = Sat
            const diffToMonday = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diffToMonday);
            return formatLocalDate(d);
        }

        function App() {
            const [categories, setCategories] = useState(() => {
                try {
                    const saved = localStorage.getItem('goal_tracker_data_v8');
                    return saved ? JSON.parse(saved) : initialCategories;
                } catch (e) {
                    return initialCategories;
                }
            });

            // Filter views: 'all' (Everything), 'daily', 'weekly', 'monthly'
            const [view, setView] = useState('all');
            const [showArchived, setShowArchived] = useState(false);
            const [currentDate, setCurrentDate] = useState(() => formatLocalDate(new Date()));
            
            // Modal states
            const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
            const [isReportModalOpen, setIsReportModalOpen] = useState(false);
            const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);

            // Task Detail / Edit Modal state (Due Date, Comments, Recurrence, & Archive)
            const [editingTaskCtx, setEditingTaskCtx] = useState(null); // { catId, subId, task }
            const [editTaskName, setEditTaskName] = useState('');
            const [editTaskFreqType, setEditTaskFreqType] = useState('daily');
            const [editTaskDays, setEditTaskDays] = useState([1, 3, 5]);
            const [editTaskMultiWeeks, setEditTaskMultiWeeks] = useState([2, 4]);
            const [editTaskMultiDays, setEditTaskMultiDays] = useState([2]);
            const [editTaskDueDate, setEditTaskDueDate] = useState('');
            const [editTaskComments, setEditTaskComments] = useState('');
            const [editTaskArchived, setEditTaskArchived] = useState(false);

            // Custom Confirmation & Notification Banner state (never uses alert/confirm)
            const [confirmDialog, setConfirmDialog] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            // Add Task granular state
            const [selectedCategory, setSelectedCategory] = useState(initialCategories[0].id);
            const [selectedSubcomp, setSelectedSubcomp] = useState(initialCategories[0].subcomponents[0].id);
            const [newTaskName, setNewTaskName] = useState('');
            const [newTaskFreqType, setNewTaskFreqType] = useState('daily');
            const [newTaskDays, setNewTaskDays] = useState([1, 3, 5]); // Mon, Wed, Fri default
            const [newTaskMultiWeeks, setNewTaskMultiWeeks] = useState([2, 4]); // e.g., 2nd & 4th
            const [newTaskMultiDays, setNewTaskMultiDays] = useState([2]); // e.g., Tuesday
            const [newTaskDueDate, setNewTaskDueDate] = useState(() => formatLocalDate(new Date()));
            const [newTaskComments, setNewTaskComments] = useState('');

            // Report fields
            const [reportTimeframe, setReportTimeframe] = useState('weekly');
            const [reportCategoryScope, setReportCategoryScope] = useState('all');
            const [isMasterReport, setIsMasterReport] = useState(false);
            const [userReportNotes, setUserReportNotes] = useState('');

            // Firebase Cloud Sync Configuration State
            const [firebaseConfigInput, setFirebaseConfigInput] = useState(() => {
                return localStorage.getItem('goal_tracker_fb_config') || '';
            });
            const [isCloudSyncActive, setIsCloudSyncActive] = useState(() => {
                return localStorage.getItem('goal_tracker_cloud_active') === 'true';
            });
            const [syncStatus, setSyncStatus] = useState('Local Mode');

            const dbRef = useRef(null);
            const unsubscribeRef = useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            useEffect(() => {
                localStorage.setItem('goal_tracker_data_v8', JSON.stringify(categories));
            }, [categories]);

            useEffect(() => {
                if (!isCloudSyncActive || !firebaseConfigInput.trim()) {
                    setSyncStatus('Local Mode');
                    if (unsubscribeRef.current) {
                        unsubscribeRef.current();
                        unsubscribeRef.current = null;
                    }
                    return;
                }

                try {
                    let cleanInput = firebaseConfigInput.trim();
                    if (cleanInput.startsWith('{')) {
                        cleanInput = `return (${cleanInput});`;
                    }
                    const config = new Function(cleanInput)();

                    if (!firebase.apps.length) {
                        firebase.initializeApp(config);
                    } else {
                        firebase.app();
                    }

                    dbRef.current = firebase.firestore();
                    setSyncStatus('Connecting...');

                    const docRef = dbRef.current.collection('goal_trackers').doc('main_user_data');

                    unsubscribeRef.current = docRef.onSnapshot((doc) => {
                        if (doc.exists) {
                            const cloudData = doc.data();
                            if (cloudData && cloudData.categories) {
                                setCategories(cloudData.categories);
                                setSyncStatus('🟢 Live Synced');
                            }
                        } else {
                            docRef.set({ categories });
                            setSyncStatus('🟢 Live Synced');
                        }
                    }, (error) => {
                        console.error("Firebase sync error:", error);
                        setSyncStatus('🔴 Sync Error');
                    });

                } catch (err) {
                    console.error("Config parse error:", err);
                    setSyncStatus('⚠️ Invalid Config');
                }

                return () => {
                    if (unsubscribeRef.current) unsubscribeRef.current();
                };
            }, [isCloudSyncActive, firebaseConfigInput]);

            const updateCategoriesAndCloud = (newCategoriesOrUpdater) => {
                setCategories(prev => {
                    const nextVal = typeof newCategoriesOrUpdater === 'function' ? newCategoriesOrUpdater(prev) : newCategoriesOrUpdater;
                    if (isCloudSyncActive && dbRef.current) {
                        dbRef.current.collection('goal_trackers').doc('main_user_data')
                            .set({ categories: nextVal })
                            .catch(err => console.error("Cloud write error:", err));
                    }
                    return nextVal;
                });
            };

            const handlePrevDate = () => {
                const d = parseLocalDate(currentDate);
                if (view === 'weekly') d.setDate(d.getDate() - 7);
                else if (view === 'monthly') d.setMonth(d.getMonth() - 1);
                else d.setDate(d.getDate() - 1);
                setCurrentDate(formatLocalDate(d));
            };

            const handleNextDate = () => {
                const d = parseLocalDate(currentDate);
                if (view === 'weekly') d.setDate(d.getDate() + 7);
                else if (view === 'monthly') d.setMonth(d.getMonth() + 1);
                else d.setDate(d.getDate() + 1);
                setCurrentDate(formatLocalDate(d));
            };

            const handleToday = () => {
                setCurrentDate(formatLocalDate(new Date()));
            };

            // Determine task's cadence bucket: 'daily' | 'weekly' | 'monthly' | 'other'
            const getTaskCadenceBucket = (task) => {
                const type = task.freqType || task.frequency;
                if (type === 'daily' || type === 'weekdays' || type === 'weekends') return 'daily';
                if (type === 'weekly' || type === 'custom-weekly') return 'weekly';
                if (type === 'monthly' || type === 'nth-weekday') return 'monthly';
                return 'other';
            };

            // Completion key per task type:
            // - Weekly tasks renew Monday morning (keyed by Monday of that week: WK-YYYY-MM-DD)
            // - Monthly tasks renew 1st of month (keyed by calendar month: MO-YYYY-MM)
            // - One-off tasks persist once completed ('DONE')
            // - Daily tasks key by exact date (YYYY-MM-DD)
            const getTaskCompletionKey = (task, dateStr = currentDate) => {
                const type = task.freqType || task.frequency;
                if (type === 'weekly' || type === 'custom-weekly') {
                    return `WK-${getMondayOfWeekStr(dateStr)}`;
                }
                if (type === 'monthly' || type === 'nth-weekday') {
                    const d = parseLocalDate(dateStr);
                    return `MO-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                }
                if (type === 'quarterly') {
                    const d = parseLocalDate(dateStr);
                    const q = Math.floor(d.getMonth() / 3) + 1;
                    return `Q-${d.getFullYear()}-Q${q}`;
                }
                if (type === 'yearly') {
                    const d = parseLocalDate(dateStr);
                    return `YR-${d.getFullYear()}`;
                }
                if (type === 'one-off') {
                    return 'ONE-OFF-DONE';
                }
                return dateStr;
            };

            const isTaskCompletedOnDate = (task, dateStr = currentDate) => {
                if (!task.completed) return false;
                const key = getTaskCompletionKey(task, dateStr);
                return !!task.completed[key];
            };

            // Check if task is overdue relative to dateStr
            const isTaskOverdue = (task, dateStr = currentDate) => {
                if (task.archived) return false;
                if (!task.dueDate) return false;
                if (isTaskCompletedOnDate(task, dateStr)) return false;
                return task.dueDate < dateStr;
            };

            // Check if dateStr matches any selected week(s) of month (1st..5th) & day(s) of week (0..6)
            const matchesNthWeekday = (dateStr, targetWeeks, targetDays) => {
                const d = parseLocalDate(dateStr);
                const weeksArr = Array.isArray(targetWeeks) ? targetWeeks.map(Number) : [Number(targetWeeks)];
                const daysArr = Array.isArray(targetDays) ? targetDays.map(Number) : [Number(targetDays)];
                
                if (!daysArr.includes(d.getDay())) return false;

                // Count which occurrence of this weekday this date is within its calendar month
                let count = 0;
                const temp = new Date(d.getFullYear(), d.getMonth(), 1);
                while (temp <= d) {
                    if (temp.getDay() === d.getDay()) count++;
                    temp.setDate(temp.getDate() + 1);
                }
                return weeksArr.includes(count);
            };

            // Check if a task occurs on a specific date
            const taskOccursOnDate = (task, dateStr) => {
                const d = parseLocalDate(dateStr);
                const dayOfWeek = d.getDay();
                const type = task.freqType || task.frequency;

                if (type === 'daily') return true;
                if (type === 'weekdays') return dayOfWeek >= 1 && dayOfWeek <= 5;
                if (type === 'weekends') return dayOfWeek === 0 || dayOfWeek === 6;
                if (type === 'weekly') return true;
                if (type === 'custom-weekly') {
                    const days = task.customDays || [];
                    return days.includes(dayOfWeek);
                }
                if (type === 'nth-weekday') {
                    const weeks = task.nthWeeks || (task.nthWeek ? [task.nthWeek] : []);
                    const days = task.nthDays || (task.nthDay !== undefined ? [task.nthDay] : []);
                    return matchesNthWeekday(dateStr, weeks, days);
                }
                if (type === 'monthly' || type === 'quarterly' || type === 'yearly') return true;
                if (type === 'one-off') {
                    return task.dueDate === dateStr || isTaskOverdue(task, dateStr);
                }
                return true;
            };

            // Filter tasks based on active view tab & archive toggle:
            const isTaskVisibleForView = (task, activeView = view) => {
                // If viewing archived tasks specifically, only show archived tasks
                if (showArchived) {
                    return !!task.archived;
                }
                // Hide archived tasks from normal operational views
                if (task.archived) return false;

                const overdue = isTaskOverdue(task, currentDate);
                if (activeView === 'all') return true;

                const bucket = getTaskCadenceBucket(task);
                if (activeView === 'daily') {
                    if (overdue) return true;
                    return bucket === 'daily' && taskOccursOnDate(task, currentDate);
                }
                if (activeView === 'weekly') {
                    return bucket === 'weekly';
                }
                if (activeView === 'monthly') {
                    return bucket === 'monthly';
                }
                return true;
            };

            const toggleTask = (catId, subId, taskId) => {
                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== catId) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== subId) return sub;
                            return {
                                ...sub,
                                tasks: sub.tasks.map(task => {
                                    if (task.id !== taskId) return task;
                                    const key = getTaskCompletionKey(task, currentDate);
                                    const currentStatus = !!(task.completed && task.completed[key]);
                                    return {
                                        ...task,
                                        completed: { ...(task.completed || {}), [key]: !currentStatus }
                                    };
                                })
                            };
                        })
                    };
                }));
            };

            const requestDeleteTask = (catId, subId, task) => {
                setConfirmDialog({
                    title: 'Delete Task',
                    message: `Are you sure you want to permanently delete "${task.name}"? (Tip: To discontinue a task without losing history, use Archive instead).`,
                    onConfirm: () => {
                        updateCategoriesAndCloud(prev => prev.map(cat => {
                            if (cat.id !== catId) return cat;
                            return {
                                ...cat,
                                subcomponents: cat.subcomponents.map(sub => {
                                    if (sub.id !== subId) return sub;
                                    return {
                                        ...sub,
                                        tasks: sub.tasks.filter(t => t.id !== task.id)
                                    };
                                })
                            };
                        }));
                        setConfirmDialog(null);
                        showToast('Task permanently deleted.');
                    }
                });
            };

            const openTaskDetailModal = (catId, subId, task) => {
                setEditingTaskCtx({ catId, subId, task });
                setEditTaskName(task.name || '');
                setEditTaskFreqType(task.freqType || task.frequency || 'daily');
                setEditTaskDays(task.customDays || [1, 3, 5]);
                setEditTaskMultiWeeks(task.nthWeeks || (task.nthWeek ? [task.nthWeek] : [2, 4]));
                setEditTaskMultiDays(task.nthDays || (task.nthDay !== undefined ? [task.nthDay] : [2]));
                setEditTaskDueDate(task.dueDate || '');
                setEditTaskComments(task.comments || '');
                setEditTaskArchived(!!task.archived);
            };

            const handleSaveTaskDetails = (e) => {
                e.preventDefault();
                if (!editingTaskCtx || !editTaskName.trim()) return;
                const { catId, subId, task } = editingTaskCtx;

                if (editTaskFreqType === 'nth-weekday' && (editTaskMultiWeeks.length === 0 || editTaskMultiDays.length === 0)) {
                    showToast('Please select at least one week and one day of the month.');
                    return;
                }

                const sortedWeeks = [...editTaskMultiWeeks].sort((a, b) => a - b);
                const sortedDays = [...editTaskMultiDays].sort((a, b) => a - b);

                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== catId) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== subId) return sub;
                            return {
                                ...sub,
                                tasks: sub.tasks.map(t => {
                                    if (t.id !== task.id) return t;
                                    return {
                                        ...t,
                                        name: editTaskName.trim(),
                                        freqType: editTaskFreqType,
                                        customDays: [...editTaskDays].sort((a, b) => a - b),
                                        nthWeeks: sortedWeeks,
                                        nthDays: sortedDays,
                                        dueDate: editTaskDueDate || null,
                                        comments: editTaskComments,
                                        archived: editTaskArchived
                                    };
                                })
                            };
                        })
                    };
                }));

                setEditingTaskCtx(null);
                showToast(editTaskArchived ? 'Task archived and hidden from active views.' : 'Task details updated.');
            };

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!newTaskName.trim()) return;

                if (newTaskFreqType === 'nth-weekday' && (newTaskMultiWeeks.length === 0 || newTaskMultiDays.length === 0)) {
                    showToast('Please select at least one week and one day of the month.');
                    return;
                }

                const sortedWeeks = [...newTaskMultiWeeks].sort((a, b) => a - b);
                const sortedDays = [...newTaskMultiDays].sort((a, b) => a - b);

                const newTask = {
                    id: 'task_' + Date.now(),
                    name: newTaskName.trim(),
                    freqType: newTaskFreqType,
                    customDays: [...newTaskDays].sort((a, b) => a - b),
                    nthWeeks: sortedWeeks,
                    nthDays: sortedDays,
                    dueDate: newTaskFreqType === 'one-off' ? newTaskDueDate : null,
                    comments: newTaskComments.trim(),
                    archived: false,
                    completed: {}
                };

                updateCategoriesAndCloud(prev => prev.map(cat => {
                    if (cat.id !== selectedCategory) return cat;
                    return {
                        ...cat,
                        subcomponents: cat.subcomponents.map(sub => {
                            if (sub.id !== selectedSubcomp) return sub;
                            return {
                                ...sub,
                                tasks: [...sub.tasks, newTask]
                            };
                        })
                    };
                }));

                setNewTaskName('');
                setNewTaskComments('');
                setIsTaskModalOpen(false);
                showToast('Task added!');
            };

            const exportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(categories, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `goal_tracker_backup_${formatLocalDate(new Date())}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const importBackup = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            updateCategoriesAndCloud(parsed);
                            showToast("Data successfully restored and synced!");
                            setIsSyncModalOpen(false);
                        } catch (err) {
                            showToast("Invalid backup file format.");
                        }
                    };
                }
            };

            const getFreqLabel = (task) => {
                const type = task.freqType || task.frequency;
                if (type === 'daily') return 'Daily';
                if (type === 'weekdays') return 'Mon-Fri';
                if (type === 'weekends') return 'Weekends';
                if (type === 'weekly') return 'Weekly (Mon-Sun)';
                if (type === 'custom-weekly') {
                    const map = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    return (task.customDays || []).map(d => map[d]).join(', ');
                }
                if (type === 'nth-weekday') {
                    const weekLabels = ['1st', '2nd', '3rd', '4th', '5th'];
                    const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    const weeks = task.nthWeeks || (task.nthWeek ? [task.nthWeek] : []);
                    const days = task.nthDays || (task.nthDay !== undefined ? [task.nthDay] : []);
                    const wStr = weeks.map(w => weekLabels[w - 1]).join('&');
                    const dStr = days.map(d => dayLabels[d]).join('/');
                    return `${wStr} ${dStr}`;
                }
                if (type === 'monthly') return 'Monthly';
                if (type === 'quarterly') return 'Quarterly';
                if (type === 'yearly') return 'Yearly';
                if (type === 'one-off') return task.dueDate ? `Due: ${task.dueDate}` : 'One-Off';
                return type;
            };

            // Main progress bar metrics dynamically reflect active view filter & archive state
            let totalTasks = 0;
            let completedTasks = 0;

            categories.forEach(cat => {
                cat.subcomponents.forEach(sub => {
                    sub.tasks.forEach(task => {
                        if (isTaskVisibleForView(task, view)) {
                            totalTasks++;
                            if (isTaskCompletedOnDate(task, currentDate)) completedTasks++;
                        }
                    });
                });
            });

            const percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            // Report calculation respects active view filter & archive state (unless Master Print All is checked)
            const generateReportData = () => {
                let scopedCats = categories;
                if (!isMasterReport && reportCategoryScope !== 'all') {
                    scopedCats = categories.filter(c => c.id === reportCategoryScope);
                }

                const effectiveViewFilter = isMasterReport ? 'all' : view;
                let total = 0;
                let completed = 0;
                const catBreakdown = [];
                const completedList = [];
                const incompleteList = [];

                scopedCats.forEach(cat => {
                    let catTotal = 0;
                    let catDone = 0;
                    cat.subcomponents.forEach(sub => {
                        sub.tasks.forEach(task => {
                            if (!isTaskVisibleForView(task, effectiveViewFilter)) return;
                            catTotal++;
                            total++;
                            const done = isTaskCompletedOnDate(task, currentDate);
                            const overdue = isTaskOverdue(task, currentDate);
                            const taskSummary = {
                                id: task.id,
                                name: task.name,
                                categoryName: cat.name,
                                subName: sub.name,
                                freqLabel: getFreqLabel(task),
                                overdue
                            };
                            if (done) {
                                catDone++;
                                completed++;
                                completedList.push(taskSummary);
                            } else {
                                incompleteList.push(taskSummary);
                            }
                        });
                    });
                    catBreakdown.push({
                        name: cat.name,
                        total: catTotal,
                        done: catDone,
                        rate: catTotal > 0 ? Math.round((catDone / catTotal) * 100) : 0
                    });
                });

                const overallRate = total > 0 ? Math.round((completed / total) * 100) : 0;
                let feedback = overallRate >= 80
                    ? "🟢 Excellent execution. High consistency maintained."
                    : overallRate >= 50
                        ? "🟡 Moderate momentum. Some recurring routines need attention."
                        : "🔴 Low completion rate. Review task loads and bottlenecks.";

                return { total, completed, overallRate, catBreakdown, completedList, incompleteList, feedback };
            };

            const reportData = generateReportData();

            const getDarkCategoryBadge = (cat) => {
                const map = {
                    family: 'bg-emerald-950/70 text-emerald-300 border-emerald-800/80',
                    church: 'bg-indigo-950/70 text-indigo-300 border-indigo-800/80',
                    consulting: 'bg-amber-950/70 text-amber-300 border-amber-800/80',
                    self_imp: 'bg-sky-950/70 text-sky-300 border-sky-800/80'
                };
                return map[cat.id] || cat.color;
            };

            const viewLabels = {
                all: 'All Tasks',
                daily: 'Daily Tasks',
                weekly: 'Weekly Tasks',
                monthly: 'Monthly Tasks'
            };

            return (
                <div className="max-w-5xl mx-auto p-4 sm:p-6">
                    {/* Floating Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-800 text-slate-100 text-xs font-semibold px-4 py-3 rounded-xl shadow-xl border border-slate-700 animate-fade-in">
                            {toastMessage}
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-slate-900 rounded-2xl shadow-lg border border-slate-800 p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <div className="flex items-center gap-3">
                                <h1 className="text-2xl font-bold text-white">Goal & Task Tracker</h1>
                                <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${syncStatus.includes('Synced') ? 'bg-emerald-950/80 text-emerald-300 border-emerald-800' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>
                                    {syncStatus}
                                </span>
                            </div>
                            <p className="text-sm text-slate-400">Live multi-device sync, daily habits, and performance reports.</p>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap">
                            <div className="flex items-center bg-slate-800 rounded-xl p-1 border border-slate-700">
                                <button onClick={handlePrevDate} title="Previous" className="p-1.5 hover:bg-slate-700 rounded-lg text-slate-300 transition shadow-sm font-bold text-xs">◀</button>
                                <button onClick={handleToday} className="px-2 text-xs font-semibold text-slate-200 hover:text-blue-400">Today</button>
                                <button onClick={handleNextDate} title="Next" className="p-1.5 hover:bg-slate-700 rounded-lg text-slate-300 transition shadow-sm font-bold text-xs">▶</button>
                            </div>
                            <input 
                                type="date" 
                                value={currentDate} 
                                onChange={e => setCurrentDate(e.target.value)}
                                style={{ colorScheme: 'dark' }}
                                className="px-3 py-2 border rounded-xl text-sm font-medium bg-slate-800 text-slate-100 border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                            <button onClick={() => setIsReportModalOpen(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-3 py-2 rounded-xl text-sm transition shadow-sm">
                                📊 Reports
                            </button>
                            <button onClick={() => setIsSyncModalOpen(true)} className="bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 font-medium px-3 py-2 rounded-xl text-sm transition shadow-sm">
                                ⚡ Cloud & Backup
                            </button>
                            <button onClick={() => setIsTaskModalOpen(true)} className="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-xl text-sm transition shadow-sm">
                                + Add Task
                            </button>
                        </div>
                    </header>

                    {/* View Switcher, Archive Toggle & Progress Bar */}
                    <div className="bg-slate-900 rounded-2xl shadow-lg border border-slate-800 p-6 mb-6">
                        <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                            <div className="flex items-center gap-2 flex-wrap">
                                <div className="inline-flex flex-wrap rounded-xl bg-slate-800 p-1 gap-1 border border-slate-700/60">
                                    <button onClick={() => { setView('all'); setShowArchived(false); }} className={`px-3.5 py-2 rounded-lg text-sm font-medium transition ${view === 'all' && !showArchived ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>All Tasks</button>
                                    <button onClick={() => { setView('daily'); setShowArchived(false); }} className={`px-3.5 py-2 rounded-lg text-sm font-medium transition ${view === 'daily' && !showArchived ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>Daily Tasks</button>
                                    <button onClick={() => { setView('weekly'); setShowArchived(false); }} className={`px-3.5 py-2 rounded-lg text-sm font-medium transition ${view === 'weekly' && !showArchived ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>Weekly Tasks</button>
                                    <button onClick={() => { setView('monthly'); setShowArchived(false); }} className={`px-3.5 py-2 rounded-lg text-sm font-medium transition ${view === 'monthly' && !showArchived ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>Monthly Tasks</button>
                                </div>
                                <button 
                                    onClick={() => setShowArchived(!showArchived)}
                                    className={`px-3.5 py-2 rounded-xl text-sm font-medium border transition ${showArchived ? 'bg-amber-950 text-amber-300 border-amber-800 shadow-sm' : 'bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200'}`}
                                >
                                    📦 {showArchived ? 'Viewing Archived' : 'Archived Tasks'}
                                </button>
                            </div>
                            <div className="text-right">
                                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">Completion Status ({showArchived ? 'Archived' : viewLabels[view]})</span>
                                <div className="text-lg font-bold text-slate-100">{completedTasks} / {totalTasks} Tasks ({percent}%)</div>
                            </div>
                        </div>
                        <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                            <div className="bg-blue-500 h-3 rounded-full transition-all duration-500" style={{ width: `${percent}%` }}></div>
                        </div>
                        <div className="mt-2.5 flex flex-wrap justify-between items-center text-[11px] text-slate-500">
                            <span>💡 Click any task to edit its schedule, update days, or archive it to hide it without losing history.</span>
                            <span>
                                {!showArchived && view === 'weekly' && `Week window: Mon ${getMondayOfWeekStr(currentDate)} – Sun`}
                                {!showArchived && view === 'monthly' && `Month window: ${currentDate.slice(0, 7)} (resets on the 1st)`}
                                {showArchived && 'Archived tasks are hidden from daily/weekly operational views but retain completion logs.'}
                            </span>
                        </div>
                    </div>

                    {/* Categories Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {categories.map(cat => {
                            const hasVisible = cat.subcomponents.some(sub => sub.tasks.some(t => isTaskVisibleForView(t, view)));
                            return (
                                <div key={cat.id} className="bg-slate-900 rounded-2xl shadow-lg border border-slate-800 p-6 flex flex-col justify-between">
                                    <div>
                                        <div className={`inline-block px-3 py-1 rounded-full text-xs font-semibold border mb-4 ${getDarkCategoryBadge(cat)}`}>
                                            {cat.name}
                                        </div>
                                        <div className="space-y-4">
                                            {cat.subcomponents.map(sub => {
                                                const visibleSubTasks = sub.tasks.filter(t => isTaskVisibleForView(t, view));
                                                if (visibleSubTasks.length === 0) return null;
                                                return (
                                                    <div key={sub.id} className="border-b border-slate-800 pb-3 last:border-0 last:pb-0">
                                                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">{sub.name}</h4>
                                                        <ul className="space-y-2">
                                                            {visibleSubTasks.map(task => {
                                                                const isChecked = isTaskCompletedOnDate(task, currentDate);
                                                                const overdue = isTaskOverdue(task, currentDate);
                                                                const hasComments = !!(task.comments && task.comments.trim());
                                                                return (
                                                                    <li 
                                                                        key={task.id} 
                                                                        className={`flex items-center justify-between gap-2 rounded-xl px-2.5 py-1.5 transition ${overdue ? 'bg-red-950/50 border border-red-800/80' : task.archived ? 'bg-slate-800/40 border border-slate-800' : 'hover:bg-slate-800/70 border border-transparent'}`}
                                                                    >
                                                                        <div className="flex items-center gap-3 min-w-0 flex-1">
                                                                            <input 
                                                                                type="checkbox" 
                                                                                checked={isChecked}
                                                                                onChange={() => toggleTask(cat.id, sub.id, task.id)}
                                                                                className="w-4 h-4 text-blue-500 bg-slate-800 rounded border-slate-600 focus:ring-blue-500 focus:ring-offset-slate-900 shrink-0 cursor-pointer"
                                                                            />
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => openTaskDetailModal(cat.id, sub.id, task)}
                                                                                title="Click to edit task or change schedule"
                                                                                className="text-left min-w-0 flex-1 group/title"
                                                                            >
                                                                                <div className="flex items-center gap-1.5 flex-wrap">
                                                                                    <span className={`text-sm truncate group-hover/title:underline ${isChecked ? 'line-through text-slate-500' : overdue ? 'text-red-300 font-semibold' : task.archived ? 'text-slate-400 italic' : 'text-slate-200 font-medium'}`}>
                                                                                        {task.name}
                                                                                    </span>
                                                                                    {task.archived && (
                                                                                        <span className="text-[10px] font-bold uppercase tracking-wider bg-amber-950 text-amber-300 border border-amber-800 px-1.5 py-0.5 rounded">
                                                                                            Archived
                                                                                        </span>
                                                                                    )}
                                                                                    {overdue && !task.archived && (
                                                                                        <span className="text-[10px] font-bold uppercase tracking-wider bg-red-600 text-white px-1.5 py-0.5 rounded">
                                                                                            Overdue ({task.dueDate})
                                                                                        </span>
                                                                                    )}
                                                                                    {!overdue && task.dueDate && (task.freqType || task.frequency) !== 'one-off' && !task.archived && (
                                                                                        <span className="text-[10px] font-medium bg-amber-950/80 text-amber-300 border border-amber-800 px-1.5 py-0.5 rounded">
                                                                                            Due {task.dueDate}
                                                                                        </span>
                                                                                    )}
                                                                                    {hasComments && (
                                                                                        <span title={task.comments} className="text-[10px] font-semibold bg-blue-950/80 text-blue-300 border border-blue-800 px-1.5 py-0.5 rounded">
                                                                                            💬 Note
                                                                                        </span>
                                                                                    )}
                                                                                </div>
                                                                            </button>
                                                                        </div>
                                                                        <div className="flex items-center gap-1.5 shrink-0">
                                                                            <span className={`text-[10px] px-2 py-0.5 rounded-md font-medium ${overdue ? 'bg-red-900/70 text-red-200' : 'bg-slate-800 text-slate-400'}`}>
                                                                                {getFreqLabel(task)}
                                                                            </span>
                                                                            <button 
                                                                                onClick={() => openTaskDetailModal(cat.id, sub.id, task)}
                                                                                title="Edit schedule & archive"
                                                                                className="text-slate-500 hover:text-blue-400 transition text-xs px-1"
                                                                            >
                                                                                ✎
                                                                            </button>
                                                                            <button 
                                                                                onClick={() => requestDeleteTask(cat.id, sub.id, task)}
                                                                                title="Permanently delete task"
                                                                                className="text-slate-600 hover:text-red-400 transition text-xs px-1 font-bold"
                                                                            >
                                                                                ✕
                                                                            </button>
                                                                        </div>
                                                                    </li>
                                                                );
                                                            })}
                                                        </ul>
                                                    </div>
                                                );
                                            })}
                                            {!hasVisible && (
                                                <p className="text-xs text-slate-500 italic py-2">
                                                    {showArchived ? 'No archived tasks found.' : `No tasks scheduled for ${viewLabels[view].toLowerCase()}.`}
                                                </p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Task Details / Edit Schedule & Archive Modal */}
                    {editingTaskCtx && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-800 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-white">Edit Task & Schedule</h3>
                                    <button onClick={() => setEditingTaskCtx(null)} className="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                                </div>
                                <form onSubmit={handleSaveTaskDetails} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Task Name</label>
                                        <input 
                                            type="text" 
                                            value={editTaskName}
                                            onChange={e => setEditTaskName(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Recurrence Pattern</label>
                                        <select 
                                            value={editTaskFreqType} 
                                            onChange={e => setEditTaskFreqType(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                        >
                                            <option value="daily">Daily</option>
                                            <option value="weekdays">Weekdays (Mon - Fri)</option>
                                            <option value="weekends">Weekends (Sat & Sun)</option>
                                            <option value="weekly">Weekly (Resets Monday Morning)</option>
                                            <option value="custom-weekly">Weekly on Specific Days</option>
                                            <option value="nth-weekday">Specific Weeks & Days of Month (e.g. 2nd & 4th Wed)</option>
                                            <option value="monthly">Monthly (Resets 1st of Month)</option>
                                            <option value="quarterly">Quarterly</option>
                                            <option value="yearly">Yearly</option>
                                            <option value="one-off">One-Off Task (Due Date)</option>
                                        </select>
                                    </div>

                                    {/* Custom Weekly Day Selector for Edit */}
                                    {editTaskFreqType === 'custom-weekly' && (
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Select Active Days</label>
                                            <div className="flex gap-1 justify-between">
                                                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((dayName, idx) => {
                                                    const isSelected = editTaskDays.includes(idx);
                                                    return (
                                                        <button
                                                            type="button"
                                                            key={idx}
                                                            onClick={() => {
                                                                if (isSelected) {
                                                                    setEditTaskDays(editTaskDays.filter(d => d !== idx));
                                                                } else {
                                                                    setEditTaskDays([...editTaskDays, idx]);
                                                                }
                                                            }}
                                                            className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${isSelected ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                        >
                                                            {dayName[0]}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {/* Multi-Week & Multi-Day Toggle Selector for Edit (e.g. changing Tuesday to Wednesday) */}
                                    {editTaskFreqType === 'nth-weekday' && (
                                        <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-3">
                                            <div>
                                                <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Toggle Weeks of Month</label>
                                                <div className="flex gap-1.5">
                                                    {[
                                                        { val: 1, label: '1st' },
                                                        { val: 2, label: '2nd' },
                                                        { val: 3, label: '3rd' },
                                                        { val: 4, label: '4th' },
                                                        { val: 5, label: '5th' }
                                                    ].map(wk => {
                                                        const active = editTaskMultiWeeks.includes(wk.val);
                                                        return (
                                                            <button
                                                                type="button"
                                                                key={wk.val}
                                                                onClick={() => {
                                                                    if (active) {
                                                                        setEditTaskMultiWeeks(editTaskMultiWeeks.filter(w => w !== wk.val));
                                                                    } else {
                                                                        setEditTaskMultiWeeks([...editTaskMultiWeeks, wk.val]);
                                                                    }
                                                                }}
                                                                className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${active ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                            >
                                                                {wk.label}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Toggle Days of Week (e.g. Switch Tue to Wed)</label>
                                                <div className="flex gap-1">
                                                    {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((dayName, idx) => {
                                                        const active = editTaskMultiDays.includes(idx);
                                                        return (
                                                            <button
                                                                type="button"
                                                                key={idx}
                                                                onClick={() => {
                                                                    if (active) {
                                                                        setEditTaskMultiDays(editTaskMultiDays.filter(d => d !== idx));
                                                                    } else {
                                                                        setEditTaskMultiDays([...editTaskMultiDays, idx]);
                                                                    }
                                                                }}
                                                                className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${active ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                            >
                                                                {dayName}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {editTaskFreqType === 'one-off' && (
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Due By Date</label>
                                            <input 
                                                type="date" 
                                                value={editTaskDueDate}
                                                onChange={e => setEditTaskDueDate(e.target.value)}
                                                style={{ colorScheme: 'dark' }}
                                                className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                            />
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Comments / Notes</label>
                                        <textarea 
                                            rows="3"
                                            placeholder="Add context or notes..."
                                            value={editTaskComments}
                                            onChange={e => setEditTaskComments(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700"
                                        ></textarea>
                                    </div>

                                    {/* Archive Toggle Switch */}
                                    <div className="flex items-center justify-between bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
                                        <div>
                                            <div className="text-xs font-bold text-slate-100 uppercase tracking-wider">Archive Task</div>
                                            <div className="text-[11px] text-slate-400">Discontinue task & hide from daily lists while keeping past completion history.</div>
                                        </div>
                                        <input 
                                            type="checkbox"
                                            checked={editTaskArchived}
                                            onChange={e => setEditTaskArchived(e.target.checked)}
                                            className="w-5 h-5 text-amber-500 bg-slate-900 rounded border-slate-600 focus:ring-amber-500 cursor-pointer"
                                        />
                                    </div>

                                    <div className="flex justify-end gap-3 pt-2">
                                        <button type="button" onClick={() => setEditingTaskCtx(null)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800">Cancel</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white hover:bg-blue-500 shadow-sm">Save Changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Custom Delete Confirmation Modal */}
                    {confirmDialog && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-slate-800">
                                <h3 className="text-lg font-bold text-white mb-2">{confirmDialog.title}</h3>
                                <p className="text-sm text-slate-300 mb-6">{confirmDialog.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800">Cancel</button>
                                    <button onClick={confirmDialog.onConfirm} className="px-4 py-2 rounded-xl text-sm font-medium bg-red-600 text-white hover:bg-red-500 shadow-sm">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add Task Modal */}
                    {isTaskModalOpen && (
                        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-800 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-lg font-bold text-white mb-4">Add Granular Task</h3>
                                <form onSubmit={handleAddTask} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Category</label>
                                        <select 
                                            value={selectedCategory} 
                                            onChange={e => {
                                                setSelectedCategory(e.target.value);
                                                const cat = categories.find(c => c.id === e.target.value);
                                                if (cat && cat.subcomponents.length > 0) setSelectedSubcomp(cat.subcomponents[0].id);
                                            }}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                        >
                                            {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Subcomponent</label>
                                        <select 
                                            value={selectedSubcomp} 
                                            onChange={e => setSelectedSubcomp(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                        >
                                            {categories.find(c => c.id === selectedCategory)?.subcomponents.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Task Name</label>
                                        <input 
                                            type="text" 
                                            placeholder="e.g. Weekly Review / Team Sync" 
                                            value={newTaskName}
                                            onChange={e => setNewTaskName(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 placeholder-slate-500 border-slate-700"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Recurrence Pattern</label>
                                        <select 
                                            value={newTaskFreqType} 
                                            onChange={e => setNewTaskFreqType(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-xl text-sm bg-slate-800 text-slate-100 border-slate-700"
                                        >
                                            <option value="daily">Daily</option>
                                            <option value="weekdays">Weekdays (Mon - Fri)</option>
                                            <option value="weekends">Weekends (Sat & Sun)</option>
                                            <option value="weekly">Weekly (Resets Monday Morning)</option>
                                            <option value="custom-weekly">Weekly on Specific Days</option>
                                            <option value="nth-weekday">Specific Weeks & Days of Month (e.g. 2nd & 4th Tue)</option>
                                            <option value="monthly">Monthly (Resets 1st of Month)</option>
                                            <option value="quarterly">Quarterly</option>
                                            <option value="yearly">Yearly</option>
                                            <option value="one-off">One-Off Task (Due Date)</option>
                                        </select>
                                    </div>

                                    {/* Custom Weekly Day Selector */}
                                    {newTaskFreqType === 'custom-weekly' && (
                                        <div>
                                            <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Select Active Days</label>
                                            <div className="flex gap-1 justify-between">
                                                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((dayName, idx) => {
                                                    const isSelected = newTaskDays.includes(idx);
                                                    return (
                                                        <button
                                                            type="button"
                                                            key={idx}
                                                            onClick={() => {
                                                                if (isSelected) {
                                                                    setNewTaskDays(newTaskDays.filter(d => d !== idx));
                                                                } else {
                                                                    setNewTaskDays([...newTaskDays, idx]);
                                                                }
                                                            }}
                                                            className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${isSelected ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                        >
                                                            {dayName[0]}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {/* Multi-Week & Multi-Day Toggle Selector */}
                                    {newTaskFreqType === 'nth-weekday' && (
                                        <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-3">
                                            <div>
                                                <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Toggle Weeks of Month (Pick 1 or more)</label>
                                                <div className="flex gap-1.5">
                                                    {[
                                                        { val: 1, label: '1st' },
                                                        { val: 2, label: '2nd' },
                                                        { val: 3, label: '3rd' },
                                                        { val: 4, label: '4th' },
                                                        { val: 5, label: '5th' }
                                                    ].map(wk => {
                                                        const active = newTaskMultiWeeks.includes(wk.val);
                                                        return (
                                                            <button
                                                                type="button"
                                                                key={wk.val}
                                                                onClick={() => {
                                                                    if (active) {
                                                                        setNewTaskMultiWeeks(newTaskMultiWeeks.filter(w => w !== wk.val));
                                                                    } else {
                                                                        setNewTaskMultiWeeks([...newTaskMultiWeeks, wk.val]);
                                                                    }
                                                                }}
                                                                className={`flex-1 py-1.5 text-xs font-bold rounded-lg border transition ${active ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
                                                            >
                                                                {wk.label}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Toggle Days of Week (Pick 1 or more)</label>
                                                <div className="flex gap-1">
                                                    {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((dayName, idx) => {
                                                        const active = newTaskMultiDays.includes(idx);
                                                        return (
                                                            <button
                                                                type="button"
                                                                key={idx}
                                                                onClick={() => {
                                                                    if (active) {
                                                                        setNewTaskMultiDays(newTaskMultiDays.filter(d => d !== idx));
                                                                    } else {
                                                                        setNewTaskMultiDays([...newTaskMultiDays, idx]);
                                                                    }
                                                                }}
